<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFPI Picks | The Greg Cote Show</title>
<style>
:root {
  --bg:#080c14; --panel:#0f1623; --panel2:#141d2e; --panel3:#1a2540;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --gold:#e8b84b; --gold2:#f5d07a; --red:#e05252; --green:#3ecf74; --blue:#4a9eff;
  --text:#eef2f7; --muted:#7a8ba8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;font-size:14px;}
.wrap{max-width:640px;margin:0 auto;padding:1.5rem 1.25rem 3rem;}
.header{margin-bottom:1.25rem;}
.title-main{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;}
.title-main span{color:var(--gold);}
.subtitle{font-size:.8rem;color:var(--muted);margin-top:4px;}
.banner{border-radius:10px;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:.8rem;line-height:1.5;}
.banner.info{background:rgba(74,158,255,.1);border:1px solid rgba(74,158,255,.3);color:var(--blue);}
.banner.error{background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.3);color:var(--red);}
.loading{color:var(--muted);font-size:.85rem;padding:2rem 0;text-align:center;}

/* Date group -- one per calendar kickoff date, chronological, games within
   it also chronological. Deadline shown once per group since every game
   in it shares the same deadline (see picks.html script for why). */
.date-group{margin-bottom:1.5rem;}
.date-heading{font-size:1rem;font-weight:800;margin-bottom:2px;}
.date-deadline{font-size:.75rem;color:var(--muted);margin-bottom:.85rem;}

.game-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.game-card.locked{opacity:.7;}

.game-teams{display:flex;align-items:center;justify-content:center;gap:1.1rem;margin-bottom:.5rem;}
.team-slot{text-align:center;min-width:0;}
.team-label{font-size:.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.team-name{font-size:1.05rem;font-weight:800;}
.at-sign{color:var(--muted);font-size:.8rem;font-weight:600;padding-top:1.1rem;}

.kickoff-time{text-align:center;font-size:.7rem;color:var(--muted);margin-bottom:.75rem;}

.locked-tag{display:block;text-align:center;color:var(--red);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem;}

.pick-buttons{display:flex;gap:8px;}
.pick-btn{flex:1;background:var(--panel2);border:1.5px solid var(--border2);color:var(--text);font-size:.85rem;font-weight:700;padding:.7rem .5rem;border-radius:8px;cursor:pointer;transition:all .15s;}
.pick-btn:hover:not(:disabled){border-color:var(--blue);}
.pick-btn.selected{background:var(--blue);border-color:var(--blue);color:#08111f;}
.pick-btn:disabled{cursor:not-allowed;}
.pick-btn.selected:disabled{background:var(--panel3);border-color:var(--gold);color:var(--gold2);}
.save-status{font-size:.68rem;color:var(--muted);margin-top:.5rem;min-height:1em;text-align:center;}
.save-status.saved{color:var(--green);}
.save-status.rejected{color:var(--red);}

.hidden{display:none !important;}
.submit-section{margin-top:1.5rem;text-align:center;}
.submit-note{font-size:.72rem;color:var(--muted);line-height:1.5;margin-top:1.1rem;margin-bottom:.6rem;}
.submit-btn{background:var(--gold);color:#1a1305;border:none;border-radius:8px;font-size:.9rem;font-weight:800;padding:.8rem 1.5rem;cursor:pointer;width:100%;}
.submit-btn:hover:not(:disabled){background:var(--gold2);}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;}
.submit-status{font-size:.75rem;margin-top:.75rem;min-height:1em;text-align:center;}
.submit-status.saved{color:var(--green);}
.submit-status.rejected{color:var(--red);}
.support-btn{display:inline-block;background:var(--panel2);border:1.5px solid var(--border2);color:var(--text);font-size:.8rem;font-weight:700;padding:.6rem 1.1rem;border-radius:8px;text-decoration:none;}
.support-btn:hover{border-color:var(--blue);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title-main">PFPI <span>Picks</span></div>
    <div class="subtitle" id="subtitle">Loading your picks...</div>
  </div>
  <div id="content"><div class="loading">Loading...</div></div>
  <div class="submit-section hidden" id="submitSection">
    <button class="submit-btn" id="submitBtn">Submit picks</button>
    <div class="submit-status" id="submitStatus"></div>
    <div class="submit-note">Picks will be sent to the commissioner. If you need technical support, please contact Yeti.</div>
    <a class="support-btn" href="mailto:yeti@yetiblanc.com?subject=PFPI%20Picks%20-%20Technical%20Support">Contact Yeti</a>
  </div>
</div>

<script>
// Points at the deployed picks-worker directly (a different origin than this
// static page). Bird Feeder principle is unaffected: this is a write action
// initiated by the visitor themselves, not a read that should be static.
const WORKER_BASE = "https://pfpi-picks-worker.yeti-f3c.workers.dev";

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

// ============================================================
// DATE/TIME FORMATTING
// ============================================================
// The deadline itself is computed exactly once, server-side, by
// computeGameDeadline() (picks-worker.js / shared.js) -- every game
// already arrives from GET /my-picks with its own real `deadline`. This
// section only GROUPS and DISPLAYS those already-computed values by
// calendar date; it does not recompute a deadline, per the redesign
// handoff's explicit "don't build a second deadline-calculation" note.
// Grouping-by-kickoff-date mirrors the same approach formatWeekDeadlines()
// (picks-worker.js, built for the weekly email) already uses server-side --
// same idea, just applied client-side against data already on the page.

function dateKeyET(iso) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(new Date(iso));
  const get = t => parts.find(p => p.type === t).value;
  return `${get("year")}-${get("month")}-${get("day")}`;
}

function fmtDateHeading(iso) {
  return new Date(iso).toLocaleString("en-US", {
    timeZone: "America/New_York", weekday: "long", month: "long", day: "numeric", year: "numeric",
  });
}

function fmtKickoffTime(iso) {
  return new Date(iso).toLocaleString("en-US", {
    timeZone: "America/New_York", hour: "numeric", minute: "2-digit",
  }) + " ET";
}

function fmtDeadlineFull(iso) {
  return new Date(iso).toLocaleString("en-US", {
    timeZone: "America/New_York", weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit",
  }) + " Eastern";
}

// ============================================================
// LOAD + RENDER (fetch logic unchanged from the previous layout)
// ============================================================

async function loadPicks() {
  const content = document.getElementById("content");
  const subtitle = document.getElementById("subtitle");

  if (!token) {
    subtitle.textContent = "";
    content.innerHTML = `<div class="banner error">No token in this link. Use the link from your weekly picks email.</div>`;
    return;
  }

  let res, data;
  try {
    res = await fetch(`${WORKER_BASE}/my-picks?token=${encodeURIComponent(token)}`);
    data = await res.json();
  } catch (e) {
    content.innerHTML = `<div class="banner error">Could not reach the picks server. Try again in a moment.</div>`;
    return;
  }

  if (!res.ok) {
    subtitle.textContent = "";
    content.innerHTML = `<div class="banner error">${data.error || "This link is invalid or has expired."}</div>`;
    return;
  }

  subtitle.textContent = `${data.team} — Week ${data.week}. Pick any time this week, deadlines are per game.`;
  content.innerHTML = "";

  if (data.games.length === 0) {
    content.innerHTML = `<div class="banner info">No games loaded for this week yet. Check back closer to kickoff.</div>`;
    return;
  }

  // Admin-issued correction links (see handleSendCorrectionEmail,
  // picks-worker.js) unlock exactly one already-locked game -- flagged
  // here so whoever's using the link knows that's what's going on, not
  // just silently seeing one unlocked game among locked ones.
  if (data.isCorrection) {
    content.innerHTML = `<div class="banner info">This is a one-time correction link — only the affected game below is unlocked past its deadline. Everything else stays locked normally.</div>`;
  }

  // Chronological by kickoff, then grouped by kickoff calendar date (ET) --
  // games within a group are already in kickoff order since the full list
  // was sorted first.
  const sorted = [...data.games].sort((a, b) => new Date(a.kickoffISO) - new Date(b.kickoffISO));
  const groups = [];
  let currentGroup = null;
  for (const game of sorted) {
    const key = dateKeyET(game.kickoffISO);
    if (!currentGroup || currentGroup.key !== key) {
      currentGroup = { key, games: [] };
      groups.push(currentGroup);
    }
    currentGroup.games.push(game);
  }

  groups.forEach(group => {
    const groupEl = document.createElement("div");
    groupEl.className = "date-group";
    // Every game in a group shares one deadline -- computeGameDeadline()
    // always resolves to the same 6pm-ET-day-before date for a given
    // kickoff calendar date, so the first game's deadline represents the
    // whole group.
    groupEl.innerHTML = `
      <div class="date-heading">${fmtDateHeading(group.games[0].kickoffISO)}</div>
      <div class="date-deadline">Deadline for picks: ${fmtDeadlineFull(group.games[0].deadline)}</div>
    `;

    group.games.forEach(game => {
      const card = document.createElement("div");
      card.className = "game-card" + (game.locked ? " locked" : "");
      card.innerHTML = `
        <div class="game-teams">
          <div class="team-slot">
            <div class="team-label">Away</div>
            <div class="team-name">${game.away}</div>
          </div>
          <div class="at-sign">@</div>
          <div class="team-slot">
            <div class="team-label">Home</div>
            <div class="team-name">${game.home}</div>
          </div>
        </div>
        <div class="kickoff-time">${fmtKickoffTime(game.kickoffISO)}</div>
        ${game.locked ? '<div class="locked-tag">Locked</div>' : ""}
        <div class="pick-buttons">
          <button class="pick-btn" data-team="${game.away}" ${game.locked ? "disabled" : ""}>${game.away}</button>
          <button class="pick-btn" data-team="${game.home}" ${game.locked ? "disabled" : ""}>${game.home}</button>
        </div>
        <div class="save-status"></div>
      `;
      const buttons = card.querySelectorAll(".pick-btn");
      buttons.forEach(btn => {
        if (btn.dataset.team === game.pick) btn.classList.add("selected");
        btn.onclick = () => savePick(game.id, btn.dataset.team, buttons, card.querySelector(".save-status"));
      });
      groupEl.appendChild(card);
    });

    content.appendChild(groupEl);
  });

  // Per Yeti (2026-08-25): a Submit button so exactly one confirmation
  // email goes out when they're actually done, not one per pick click.
  // Individual clicks above still save immediately via /submit-picks --
  // that hasn't changed -- they just no longer email anyone by
  // themselves; only clicking Submit (handleConfirmPicks server-side)
  // does that now.
  document.getElementById("submitSection").classList.remove("hidden");
}

async function savePick(gameId, teamPicked, buttons, statusEl) {
  buttons.forEach(b => b.classList.toggle("selected", b.dataset.team === teamPicked));
  statusEl.textContent = "Saving...";
  statusEl.className = "save-status";

  try {
    const res = await fetch(`${WORKER_BASE}/submit-picks`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, picks: { [gameId]: teamPicked } }),
    });
    const data = await res.json();
    if (data.rejectedLockedGames && data.rejectedLockedGames.includes(gameId)) {
      statusEl.textContent = "That game already locked, pick not saved.";
      statusEl.className = "save-status rejected";
    } else {
      statusEl.textContent = "Saved.";
      statusEl.className = "save-status saved";
    }
  } catch (e) {
    statusEl.textContent = "Could not save, try again.";
    statusEl.className = "save-status rejected";
  }
}

document.getElementById("submitBtn").onclick = async () => {
  const btn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("submitStatus");
  btn.disabled = true;
  btn.textContent = "Submitting...";
  statusEl.textContent = "";
  statusEl.className = "submit-status";

  try {
    const res = await fetch(`${WORKER_BASE}/confirm-picks`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token }),
    });
    const data = await res.json();
    btn.disabled = false;
    btn.textContent = "Submit picks";
    if (!res.ok) {
      statusEl.textContent = data.error || "Could not submit picks.";
      statusEl.className = "submit-status rejected";
      return;
    }
    statusEl.textContent = "Picks submitted to the commissioner.";
    statusEl.className = "submit-status saved";
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Submit picks";
    statusEl.textContent = "Could not reach the server, try again.";
    statusEl.className = "submit-status rejected";
  }
};

loadPicks();
</script>
</body>
</html>
