<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFPI 2026 | The Greg Cote Show</title>
<style>
:root {
  --bg:#080c14; --panel:#0f1623; --panel2:#141d2e; --panel3:#1a2540;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --gold:#e8b84b; --gold2:#f5d07a; --red:#e05252; --green:#3ecf74; --blue:#4a9eff;
  --text:#eef2f7; --muted:#7a8ba8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;font-size:14px;}

.header{background:var(--panel);border-bottom:1px solid var(--border2);padding:1rem 1.5rem;position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;margin-bottom:.75rem;}
.title-main{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
.title-main span{color:var(--gold);}
.title-sub{font-size:.65rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}

.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:10px;overflow-x:auto;max-width:100%;}
.tab-btn{background:none;border:none;color:var(--muted);font-size:.72rem;font-weight:600;padding:7px 12px;border-radius:7px;cursor:pointer;transition:all .15s;white-space:nowrap;letter-spacing:.02em;flex-shrink:0;}
.tab-btn.active{background:var(--panel3);color:var(--gold);}
.tab-btn:hover:not(.active){color:var(--text);}

.week-row{display:flex;gap:3px;overflow-x:auto;padding:3px 0;}
.week-row::-webkit-scrollbar{height:5px;}
.week-row::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.week-btn{background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:.68rem;font-weight:600;padding:5px 10px;border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;min-width:38px;text-align:center;}
.week-btn.active{background:var(--blue);color:#08111f;border-color:var(--blue);}
.week-btn:hover:not(.active){color:var(--text);border-color:var(--border2);}
.week-btn.final{border-color:var(--gold);}
.week-btn.final.active{background:var(--gold);color:#08111f;}

.wrap{max-width:960px;margin:0 auto;padding:1.25rem 1.5rem 3rem;}

.empty-state{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:2.5rem 1.25rem;text-align:center;color:var(--muted);font-size:.85rem;font-style:italic;}
.category-header-right{display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;}
.tie-note{background:rgba(232,184,75,.1);border:1px solid rgba(232,184,75,.3);border-radius:8px;padding:.45rem .75rem;font-size:.7rem;color:var(--gold2);line-height:1.45;text-align:right;max-width:300px;}
.hidden{display:none !important;}
/* chart-panel's own padding is tuned for the bar chart's floating value
   labels above each bar — pull the empty state back up so it isn't
   oddly top-heavy when there's no chart to make room for. */
#chartEmpty{margin-top:-3.35rem;}

.category-header{margin-bottom:1rem;display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;}
.category-title{font-size:1.05rem;font-weight:800;}
.category-desc{font-size:.78rem;color:var(--muted);margin-top:2px;}
.week-label{font-size:.7rem;color:var(--blue);font-weight:700;background:rgba(74,158,255,.12);padding:4px 10px;border-radius:6px;white-space:nowrap;}
.week-label.final{color:var(--gold);background:rgba(232,184,75,.12);}

.chart-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:4.6rem 1.25rem 1rem;position:relative;overflow:visible;}

.chart-area{display:flex;flex-direction:column;gap:0;}
.plot-row{display:flex;gap:.5rem;height:300px;}
.y-axis{display:flex;flex-direction:column;justify-content:space-between;font-size:.62rem;color:var(--muted);text-align:right;width:36px;flex-shrink:0;}
.bars-area{flex:1;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-left:1px solid var(--border2);border-bottom:1px solid var(--border2);padding-left:.5rem;position:relative;overflow:visible;}
.grid-line{position:absolute;left:0;right:0;border-top:1px dashed var(--border);}
.labels-row{display:flex;gap:.5rem;margin-top:10px;}
.labels-spacer{width:36px;flex-shrink:0;}
.labels-cols{flex:1;display:flex;justify-content:space-between;gap:10px;padding-left:.5rem;}

.bar-col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;width:0;position:relative;overflow:visible;}
.bar-value-label{font-size:.68rem;font-weight:800;color:var(--gold);text-align:center;line-height:1.2;position:absolute;bottom:100%;left:0;right:0;margin-bottom:10px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5;}
.bar-el{width:100%;max-width:46px;border-radius:5px 5px 0 0;transition:height .25s;position:relative;min-height:2px;display:flex;align-items:flex-end;justify-content:center;}
.bar-bottom-label{font-size:.62rem;font-weight:800;color:rgba(8,12,20,.8);margin-bottom:5px;letter-spacing:.01em;}
.label-col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;min-width:0;}
.bar-team-avatar{width:28px;height:28px;border-radius:50%;background:var(--panel3);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.6rem;flex-shrink:0;}
.bar-team-name{font-size:.6rem;color:var(--muted);text-align:center;margin-top:4px;line-height:1.15;max-width:70px;}

.crown{font-size:1.3rem;line-height:1;filter:drop-shadow(0 0 6px rgba(232,184,75,.6));animation:crownFloat 2.2s ease-in-out infinite;z-index:5;}
@keyframes crownFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.bar-col.is-champion .bar-value-label{color:var(--gold2);}
.bar-col.is-champion .bar-team-avatar{border-width:2px;box-shadow:0 0 0 3px rgba(232,184,75,.15);}

/* Unique Hits' leader icon -- a grey raccoon face, not a crown. Deliberate
   nod to Ruth Cote ("Ruth's Raccoons"), PFPI's all-time Unique Hits leader
   -- see BUILD_LOG.md. Same positioning/animation/tie-sharing as the
   crown. (Was a coon-skin hat before 2026-08-26; swapped per Yeti.) */
.raccoon-icon{width:24px;height:21px;filter:drop-shadow(0 0 5px rgba(150,150,160,.55));animation:crownFloat 2.2s ease-in-out infinite;z-index:5;}

/* Two-tone vertical mascot lettering (2026-08-26 round, replacing the
   earlier "shrink to fit inside the bar" version -- that became illegibly
   small on short/low-value bars). Confirmed-viable redesign, agreed with
   Yeti: the text is now a CHILD OF .bar-col, not .bar-el, so its size and
   vertical span are fixed relative to the whole card (top:0/bottom:0 of
   bar-col's full height) and never shrink with the bar. Legibility is
   handled by color instead of size: a background-clip:text gradient with
   a HARD color stop exactly at the bar's current fill line -- the portion
   of the text below the fill line (visually "inside" the bar) renders in
   a dark, bar-legible color; the portion above it (against the card's
   dark background) renders in a light, background-legible color. The
   stop position is set inline per-bar from the exact same `pct` value
   that sets .bar-el's own height (see render()) -- never computed
   separately, so it cannot drift out of sync with the bar's real fill.
   Font size is still set per-team inline by JS (sizeMascotLabels()), now
   measuring the fixed-height .bar-col instead of the shrinking .bar-el.
   z-index sits below .bar-value-label/crown (z-index:5) so the rank
   number and crown/raccoon icon always stay legible on top where they
   cross -- above .bar-el's own plain color fill so the gradient text is
   actually visible. */
.bar-mascot-label{
  position:absolute;top:0;bottom:0;left:50%;width:1.3em;
  transform:translateX(-50%) rotate(180deg);
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;font-weight:800;letter-spacing:.03em;
  white-space:nowrap;pointer-events:none;overflow:hidden;z-index:3;
  background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent;
}

.legend-note{font-size:.68rem;color:var(--muted);margin-top:1.25rem;padding-top:.75rem;border-top:1px solid var(--border);}
.footer-copyright{text-align:center;font-size:.68rem;color:var(--muted);margin-top:1.5rem;}

.brief-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.4rem;margin-top:1rem;}
.brief-header{display:flex;align-items:flex-end;justify-content:space-between;gap:.75rem;margin-bottom:.85rem;flex-wrap:wrap;}
/* Matches .category-title/.category-desc's size+weight+color exactly, per
   Yeti (2026-08-26) -- was a small uppercase gold label before. */
.brief-label{font-size:1.05rem;font-weight:800;}
.brief-subtitle{font-size:.78rem;color:var(--muted);margin-top:2px;}
.brief-week-tag{font-size:.65rem;color:var(--muted);background:var(--panel2);border:1px solid var(--border2);border-radius:6px;padding:3px 9px;}
/* Monospace fix (2026-08-28, per Yeti) -- the digest's Standings table
   (and similar space-padded sections) only lines up in a monospace font;
   this is the third of three locations fixed together (see BUILD_LOG.md
   and brief.html's #briefText comment) -- same exact font stack as
   brief.html/admin.html's #briefText and .digest-output so alignment is
   guaranteed identical end-to-end from digest preview through to this
   published page, not just "some monospace font." Applies to the whole
   published brief, not just an inserted-digest portion -- this is plain
   text with no markup boundary to target just that part, and a real HTML
   table was explicitly deferred in favor of this simpler fix. Means any
   of Greg's own free-typed prose in a brief now publishes in monospace
   too -- a real visual tradeoff to get his reaction on, not hidden. */
.brief-body{font-size:.86rem;line-height:1.65;color:var(--text);white-space:pre-wrap;font-family:"SF Mono",Consolas,"Courier New",monospace;}
.brief-body.empty{color:var(--muted);font-style:italic;}

.games-panel{display:none;}
.games-panel.active{display:block;}
.games-list{display:flex;flex-direction:column;gap:8px;}

.game-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .15s;}
.game-card.expanded{border-color:var(--border2);}
.game-row{display:flex;align-items:center;gap:.75rem;padding:.7rem .9rem;cursor:pointer;user-select:none;}
.game-row:hover{background:var(--panel2);}
.game-matchup{flex:1;display:flex;align-items:center;justify-content:center;gap:.6rem;min-width:0;}
.game-team{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;}
.game-team.winner{color:var(--gold2);}
.game-score{font-size:.95rem;font-weight:800;min-width:1.4em;text-align:center;}
.game-at{color:var(--muted);font-size:.68rem;font-weight:600;}
.game-status{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;width:92px;flex-shrink:0;text-align:right;line-height:1.3;}
.game-status.final{color:var(--green);}
.game-status.tie{color:var(--gold2);}
.game-clock{font-size:.6rem;color:var(--muted);text-transform:none;letter-spacing:0;margin-top:.1rem;}
.game-tie-flag{font-size:.6rem;color:var(--gold2);text-transform:none;letter-spacing:0;margin-top:.15rem;font-weight:700;}
.game-expand-icon{color:var(--muted);font-size:.7rem;flex-shrink:0;transition:transform .15s;width:14px;text-align:center;}
.game-card.expanded .game-expand-icon{transform:rotate(180deg);}

.picks-breakdown{border-top:1px solid var(--border);padding:.75rem .9rem .9rem;background:var(--panel2);}
.picks-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.pick-chip{display:flex;align-items:center;gap:6px;background:var(--panel3);border:1px solid var(--border);border-radius:8px;padding:6px 8px;}
.pick-chip.correct{border-color:rgba(62,207,116,.4);}
.pick-chip.incorrect{border-color:rgba(224,82,82,.3);opacity:.75;}
.pick-avatar{width:20px;height:20px;border-radius:50%;background:var(--panel);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.52rem;flex-shrink:0;}
.pick-info{min-width:0;}
.pick-team-name{font-size:.6rem;color:var(--muted);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pick-choice-row{display:flex;align-items:center;gap:4px;}
.pick-choice{font-size:.68rem;font-weight:700;line-height:1.2;}
.pick-choice.correct-text{color:var(--green);}
.pick-choice.incorrect-text{color:var(--red);}
/* Unique-pick badge (2026-08-29, per Yeti): same raccoon artwork as the
   Unique Hits leaderboard icon (see raccoonSvg() -- one shared function,
   never a second copy), just smaller and static (no float animation --
   many chips could show this at once on a busy week, unlike the
   leaderboard's single per-category icon). Only ever rendered once a
   game is locked -- see renderGames()'s own comment for why revealing
   this pre-lock would be a real problem, not just an aesthetic one. */
.pick-raccoon-icon{width:16px;height:14px;flex-shrink:0;filter:drop-shadow(0 0 3px rgba(150,150,160,.5));}

@media(max-width:650px){
  .wrap{padding:1rem;}
  .header{padding:.75rem 1rem;}
  .title-main{font-size:1.05rem;}
  .plot-row{height:220px;}
  .bars-area{gap:5px;}
  .bar-team-name{display:none;}
  .picks-grid{grid-template-columns:repeat(2,1fr);}
  /* Per Yeti (2026-08-27): the tab row required a horizontal swipe to see
     every category on mobile -- wraps to as many lines as needed instead
     (normally two on a phone-width screen), full-width so the wrap looks
     intentional rather than a lopsided leftover single column. */
  .header-top{flex-wrap:wrap;}
  .tabs{flex-wrap:wrap;overflow-x:visible;width:100%;}
  /* Second independent overflow source found alongside the mascot-label
     fix above (2026-08-27): .bar-team-avatar is a hard 28px circle with no
     shrink logic at all -- 8 of them plus gaps have a ~294px content-width
     floor no matter how narrow the screen is, which alone was enough to
     force the whole page into horizontal scroll on narrow phones even
     with the label-width fix in place. Shrunk here (and the row's own gap
     tightened) rather than hidden, unlike .bar-team-name above, since the
     avatar is the only per-team identifier left once the name is hidden. */
  .bar-team-avatar{width:20px;height:20px;font-size:.5rem;}
  .labels-cols{gap:4px;}
}
</style>

<script>
// In-house visitor analytics beacon (2026-08-29, per Yeti) -- fires once
// per pageload to pfpi-scores-worker's /track endpoint, which computes
// two anonymous one-way hashes (never stores raw IP) to count today's
// unique visitors and detect returning ones; see worker.js's own long
// comment above handleTrack() for the full reasoning on why there are
// two hashes, not one. `?notrack=1` on this page's own URL skips this
// entirely, honored both here and again server-side. `keepalive:true` so
// the request still completes if the visitor navigates away immediately;
// wrapped in try/catch and .catch() so a network hiccup here can never
// break the actual page.
//
// Persistent opt-out (2026-08-29, per Yeti): visiting once with
// ?notrack=1 also sets a localStorage flag, so a personal opt-out link
// (for Yeti/Greg/Chris) only needs to be clicked once, not on every
// visit. localStorage is scoped per-origin, so this flag is shared by
// index.html and picks.html automatically (same site, same origin) --
// it is NOT shared across separate devices/browsers, since localStorage
// never is; each device that should be excluded needs its own one-time
// click. This is the same limitation any localStorage-based opt-out has.
(function () {
  var urlNotrack = new URLSearchParams(location.search).get("notrack") === "1";
  var storedNotrack = false;
  try { storedNotrack = localStorage.getItem("pfpi_notrack") === "1"; } catch (e) {}
  if (urlNotrack) {
    try { localStorage.setItem("pfpi_notrack", "1"); } catch (e) {}
  }
  var notrack = urlNotrack || storedNotrack;
  try {
    fetch("https://pfpi-scores-worker.yeti-f3c.workers.dev/track", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ page: "index", referrer: document.referrer, notrack: notrack }),
      keepalive: true,
    }).catch(function () {});
  } catch (e) {}
})();
</script>

<script>
const TEAMS = ["Lobos","Roughriders","Maniacs","Critters","Chickens","Ferraris","Llamas","Giraffes"];

const TEAM_COLORS = {
  "Lobos":"#e8b84b","Roughriders":"#4a9eff","Maniacs":"#3ecf74","Critters":"#e05252",
  "Chickens":"#a78bfa","Ferraris":"#f5d07a","Llamas":"#38bdf8","Giraffes":"#fb923c"
};
const TEAM_SHORT = {
  "Lobos":"Greg's Lobos","Roughriders":"Dick's Roughriders","Maniacs":"Mom's Maniacs","Critters":"Chris' Critters",
  "Chickens":"Mike's Chickens","Ferraris":"Christie's Ferraris","Llamas":"Tati's Llamas","Giraffes":"Gracelin's Giraffes"
};

// Two-tone mascot lettering colors (2026-08-26 round). IN_BAR matches the
// existing .bar-bottom-label color exactly (already proven legible against
// every TEAM_COLORS fill, all light/pastel tones); ABOVE_BAR is a
// translucent light tone (based on --text) for legibility against the
// dark card background.
const MASCOT_IN_BAR_COLOR = "rgba(8,12,20,.72)";
const MASCOT_ABOVE_BAR_COLOR = "rgba(238,242,247,.55)";
function initials(fullName){
  const words = fullName.replace(/['']s\b/,"'s").split(/\s+/).filter(Boolean);
  if (words.length < 2) return fullName.slice(0,2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
// Best Week keeps its existing 3-digit format (e.g. ".875") -- the sole
// exception per Yeti (2026-08-26 big feedback round). Everything else
// showing a fractional value uses fmtPct2 (2-digit) instead.
function fmtPct(v){
  const s = v.toFixed(3);
  return s === "1.000" ? "1.000" : s.replace(/^0/, "");
}
function fmtPct2(v){
  const s = v.toFixed(2);
  return s === "1.00" ? "1.00" : s.replace(/^0/, "");
}

const NUM_WEEKS = 18;

// Preseason Week 3 (Aug 27-29, 2026) is a real, live-updating data source
// (Highlightly — see worker.js/BUILD_LOG.md) but not a numbered PFPI week.
// Real picks ARE scored against it (added 2026-08-27, per Yeti -- see
// computePreseasonSnapshot() in worker.js) as a full dress-rehearsal
// stress-test, just kept structurally isolated from the real season's
// cumulative totals. Its own button sits to the left of Wk 1 in the week
// row, chronologically before the season, per Yeti (2026-08-25).
const PRESEASON_WEEK_KEY = "preseason-3";

// The 2026 season is now the live site (2025-simulation.html in /archive is
// the retired design/testing tool this replaced — see BUILD_LOG.md). Whatever
// week is currently in progress (or the most recently completed one) is
// CURRENT_WEEK; weeks beyond it haven't happened yet and shouldn't be
// selectable. Starts at 1 (matches the same pre-season fallback
// computeCurrentWeekFromDate() in shared.js uses) and gets corrected to the
// real value once data/current.json loads below — genuinely correct either
// way, never a guess.
let CURRENT_WEEK = 1;

// ── REAL DATA WIRING ──
// The scores worker (worker.js, cron job) publishes data/current.json,
// data/standings.json and data/week-N.json into this repo by polling Big
// Balls Sports Data. Before the 2026 season actually has games with results
// (kickoff Sept 9 2026), most of this legitimately has nothing to show yet —
// render() below reflects that honestly (empty states, not fabricated
// numbers) rather than falling back to placeholder data.
const REAL = {
  currentWeek: null, standings: null, standingsPct: null, weeks: {}, briefs: {}, tieNotes: {},
  weeklyTitles: null, weeksLeading: null, bestWeek: null,
  // Preseason's own Standings/Weekly Titles/Weeks Leading/Best Week
  // snapshot (2026-08-27 round) -- deliberately a completely separate
  // object from the five fields above, loaded from data/week-preseason-3
  // .json's own `stats` field, never from data/standings.json. See
  // worker.js's computePreseasonSnapshot() for why this file-level
  // separation is the structural guarantee that preseason can never sum
  // into real regular-season cumulative totals -- there is no code path
  // here that reads preseason data into any of the five REAL.* fields
  // above, or vice versa.
  preseasonStats: null,
};

async function fetchJSON(path) {
  try {
    const res = await fetch(path + "?t=" + Date.now()); // cache-bust: GitHub Pages
                                                          // propagation lag is
                                                          // untested, see architecture doc
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function initRealData() {
  const cur = await fetchJSON("data/current.json");
  if (cur && cur.currentWeek) {
    REAL.currentWeek = cur.currentWeek;
    CURRENT_WEEK = cur.currentWeek;
    currentWeek = cur.currentWeek; // one-time sync on initial load only —
                                    // later polls don't override the week
                                    // the visitor has manually selected
    const st = await fetchJSON("data/standings.json");
    if (st && st.standings) {
      REAL.standings = st.standings;
      REAL.standingsPct = st.standingsPct;
      REAL.tieNotes = st.tieNotes || {};
      // weeklyTitles/weeksLeading/bestWeek are new fields (worker.js,
      // 2026-08-25) -- guard against a stale cached data/standings.json from
      // before they existed, same GitHub Pages propagation-lag gap noted
      // elsewhere in this file, rather than treat an old file as "no data".
      REAL.weeklyTitles = st.weeklyTitles || null;
      REAL.weeksLeading = st.weeksLeading || null;
      REAL.bestWeek = st.bestWeek || null;
      // uniqueHits/tenWinWeeks added 2026-08-28 (worker.js) -- same stale-
      // cache guard as above.
      REAL.uniqueHits = st.uniqueHits || null;
      REAL.tenWinWeeks = st.tenWinWeeks || null;
    }
  }
  await render();
}

async function loadRealWeek(week) {
  if (REAL.weeks[week] !== undefined) return REAL.weeks[week];
  // Preseason isn't a numbered PFPI week, so it skips the currentWeek gate
  // below entirely — it's real data with real games, just not part of the
  // regular season's progressive reveal.
  if (week === PRESEASON_WEEK_KEY) {
    const data = await fetchJSON(`data/week-${week}.json`);
    REAL.weeks[week] = (data && Array.isArray(data.games)) ? data.games : null;
    // Same fetch already has preseason's own stats snapshot (`stats`,
    // written by worker.js's computePreseasonSnapshot()) -- captured here
    // rather than a second request, and guarded against a stale cached
    // file from before this field existed (same GitHub Pages
    // propagation-lag gap noted elsewhere in this file).
    REAL.preseasonStats = (data && data.stats) ? data.stats : null;
    return REAL.weeks[week];
  }
  if (!REAL.currentWeek || week > REAL.currentWeek) { REAL.weeks[week] = null; return null; }
  const data = await fetchJSON(`data/week-${week}.json`);
  REAL.weeks[week] = (data && Array.isArray(data.games)) ? data.games : null;
  return REAL.weeks[week];
}

async function loadRealBrief(week) {
  if (REAL.briefs[week] !== undefined) return REAL.briefs[week];
  const data = await fetchJSON(`data/brief-week-${week}.json`);
  REAL.briefs[week] = (data && typeof data.text === "string") ? data.text : null;
  return REAL.briefs[week];
}

// Routes to the right source object for a given week -- preseason's own
// isolated snapshot (REAL.preseasonStats) vs. the real regular-season
// cumulative data (REAL.*). `field` is "standings", "standingsPct",
// "weeklyTitles", "weeksLeading", or "bestWeek" -- same names on both
// sides, since computePreseasonSnapshot() (worker.js) deliberately mirrors
// computeStandings()'s output shape so every existing consumer below
// (hasRealDataForWeek, the isStandings pct lookup, etc.) works unchanged
// regardless of which source it's pointed at.
function realDataFor(field, week) {
  if (week === PRESEASON_WEEK_KEY) return REAL.preseasonStats ? REAL.preseasonStats[field] : null;
  return REAL[field];
}

function hasRealStandingsForWeek(week) {
  const source = realDataFor("standings", week);
  return !!source && TEAMS.every(t => source[t] && source[t][String(week)] !== undefined);
}

// Generic version of the check above, for any per-team-per-week data object
// shaped like REAL.standings (weeklyTitles, weeksLeading, bestWeek all match
// that shape, whether the per-week value is a number or an object).
function hasRealDataForWeek(dataObj, week) {
  return !!dataObj && TEAMS.every(t => dataObj[t] && dataObj[t][String(week)] !== undefined);
}

// Category defs unchanged from the original build (scope of the 2025->2026
// switchover is a data-source swap, not a rules change) — only getData
// changed, from "real-or-simulated" to "real-or-null". Tie-splitting rule
// for weeksLeading/weeklyTitles/bestWeek confirmed by Greg via Yeti
// (2026-08-25, see worker.js's computeStandings and BUILD_LOG.md) -- those
// three are now real, computed server-side from actual picks/results, same
// as Standings. tenWin and uniqueHits have no real data source at all
// (Greg couldn't find historical stats) and stay on an honest empty state
// per Yeti's explicit, unchanged decision.
const CATEGORIES = {
  standings: {
    label: "Standings",
    title: "Season standings",
    desc: "Cumulative correct picks through the selected week.",
    getData: w => hasRealStandingsForWeek(w) ? realDataFor("standings", w) : null, unit: "", key: w => w, isStandings: true
  },
  weeksLeading: {
    label: "Weeks Leading",
    title: "Weeks leading",
    desc: "Points for holding first place in the overall standings, split on ties.",
    getData: w => hasRealDataForWeek(realDataFor("weeksLeading", w), w) ? realDataFor("weeksLeading", w) : null, unit: "pts", key: w => w
  },
  weeklyTitles: {
    label: "Weekly Titles",
    title: "Weekly titles",
    desc: "Points for the best record in each individual week, split on ties.",
    getData: w => hasRealDataForWeek(realDataFor("weeklyTitles", w), w) ? realDataFor("weeklyTitles", w) : null, unit: "pts", key: w => w
  },
  tenWin: {
    label: "10-Win Weeks",
    title: "10-win weeks",
    desc: "Count of weeks with 10+ correct picks, through the selected week.",
    // Real as of 2026-08-28 (worker.js's computeStandings()/
    // computePreseasonSnapshot()) -- updates the moment a team's running
    // correct count for a week reaches 10, not just once the week ends.
    getData: w => hasRealDataForWeek(realDataFor("tenWinWeeks", w), w) ? realDataFor("tenWinWeeks", w) : null, unit: "wks", key: w => w
  },
  uniqueHits: {
    label: "Unique Hits",
    title: "Unique hits",
    desc: "Hits-to-opportunities on picks nobody else made, through the selected week.",
    // Real for both preseason and regular season now (extended to the
    // real season 2026-08-28, per Yeti -- see
    // computePreseasonSnapshot()'s own note in worker.js for why this one
    // category's "permanently out of scope" status changed and 10-Win
    // Weeks' didn't). realDataFor() itself already returns REAL.uniqueHits
    // for real weeks, which stays undefined forever since
    // computeStandings() was NOT changed -- hasRealDataForWeek() below
    // correctly falls back to null for real weeks with no special-casing
    // needed here.
    getData: w => hasRealDataForWeek(realDataFor("uniqueHits", w), w) ? realDataFor("uniqueHits", w) : null, unit: "", key: w => w, isHitsOpps: true
  },
  bestWeek: {
    label: "Best Week",
    title: "Best week (running record)",
    desc: "Each team's best single-week record so far this season — only increases when beaten.",
    getData: w => hasRealDataForWeek(realDataFor("bestWeek", w), w) ? realDataFor("bestWeek", w) : null, unit: "", key: w => w, isBestWeek: true
  }
};

let currentCat = "standings";
let currentWeek = CURRENT_WEEK;

function renderTabs(){
  const el = document.getElementById("tabs"); el.innerHTML = "";

  const gamesBtn = document.createElement("button");
  gamesBtn.className = "tab-btn" + (currentCat === "games" ? " active" : "");
  gamesBtn.textContent = "Games";
  gamesBtn.onclick = () => { currentCat = "games"; render(); };
  el.appendChild(gamesBtn);

  Object.keys(CATEGORIES).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (key===currentCat ? " active":"");
    btn.textContent = CATEGORIES[key].label;
    btn.onclick = () => { currentCat = key; render(); };
    el.appendChild(btn);
  });
}

function renderWeekRow(){
  const el = document.getElementById("weekRow"); el.innerHTML = "";

  const preseasonBtn = document.createElement("button");
  preseasonBtn.className = "week-btn" + (currentWeek === PRESEASON_WEEK_KEY ? " active" : "");
  preseasonBtn.textContent = "Preseason";
  // Games is the only category that makes sense for preseason -- no PFPI
  // picks are scored against it, so Standings/etc. would just show an
  // honest "no data" empty state. Switching straight to Games is the more
  // useful default than making a visitor click over themselves.
  preseasonBtn.onclick = () => { currentWeek = PRESEASON_WEEK_KEY; currentCat = "games"; render(); };
  el.appendChild(preseasonBtn);

  for (let w=1; w<=CURRENT_WEEK; w++){
    const btn = document.createElement("button");
    const isCurrent = w === CURRENT_WEEK;
    const isSeasonFinal = w === NUM_WEEKS;
    btn.className = "week-btn" + (w===currentWeek?" active":"") + (isCurrent?" final":"");
    btn.textContent = isSeasonFinal ? "Final" : "Wk " + w;
    btn.onclick = () => { currentWeek = w; render(); };
    el.appendChild(btn);
  }
}

// Shared raccoon SVG markup (2026-08-29, per Yeti) -- extracted so the
// Unique Hits leaderboard icon (below) and the Games tab's "unique pick"
// badge (renderGames(), further down) are guaranteed to always be the
// exact same artwork, not two copies that could silently drift apart.
// `size` is the rendered width in px; height is derived from the SVG's
// own 28:24(ish) viewBox aspect ratio the original icon already used.
function raccoonSvg(size) {
  const height = Math.round(size * 21 / 24);
  return `<svg viewBox="0 0 28 24" width="${size}" height="${height}" xmlns="http://www.w3.org/2000/svg">
    <circle cx="6" cy="6" r="4" fill="#9096a0"/>
    <circle cx="22" cy="6" r="4" fill="#9096a0"/>
    <ellipse cx="14" cy="13" rx="11" ry="9" fill="#aaafb8"/>
    <ellipse cx="14" cy="17" rx="6" ry="4.5" fill="#eceef0"/>
    <path d="M4 11 Q14 6.5 24 11 Q14 15.5 4 11 Z" fill="#33363b"/>
    <circle cx="10" cy="11" r="1.3" fill="#fff"/>
    <circle cx="18" cy="11" r="1.3" fill="#fff"/>
    <ellipse cx="14" cy="17.5" rx="1.4" ry="1" fill="#222427"/>
  </svg>`;
}

async function render(){
  renderTabs(); renderWeekRow();

  const isPreseason = currentWeek === PRESEASON_WEEK_KEY;
  const isFinal = !isPreseason && currentWeek === NUM_WEEKS;

  // Preseason's stats snapshot (REAL.preseasonStats) is only ever
  // populated as a side effect of loadRealWeek() -- previously only
  // called from the Games-tab branch below, which meant selecting a chart
  // category (Standings etc.) for preseason without ever visiting Games
  // first would leave it null. Called unconditionally here instead so
  // every category tab has it available; loadRealWeek() already caches
  // per-session, so this is a no-op re-fetch once it's loaded once.
  if (isPreseason) await loadRealWeek(PRESEASON_WEEK_KEY);
  const weekLabelEl = document.getElementById("weekLabel");
  weekLabelEl.textContent = isPreseason ? "Preseason Week 3" : isFinal ? "Final — Week 18" : "Through Week " + currentWeek;
  weekLabelEl.className = "week-label" + (isFinal?" final":"");

  // Tie-game note, per Yeti (2026-08-25, reworked 2026-08-31 after preseason
  // Week 3 surfaced two real gaps): visible near the chart, not buried in a
  // tooltip, for any week with a real nullified tie. Routed through
  // realDataFor() (same as standings/weeklyTitles/etc.) so preseason gets
  // this too -- previously only computeStandings() (real weeks) ever
  // populated tieNotes at all, so preseason's Week 3 tie (KC @ SEA, 9-9)
  // showed reduced totals with no visible explanation. Chart tabs only
  // (gated on currentCat !== "games") -- the Games tab gets its own
  // per-game note instead (see renderGames()), so this doesn't duplicate
  // the same information twice on that tab.
  const tieNoteEl = document.getElementById("tieNote");
  const weekTies = currentCat !== "games" ? (realDataFor("tieNotes", currentWeek) || {})[currentWeek] : null;
  if (weekTies && weekTies.length > 0) {
    const n = weekTies.length;
    const gameWord = n === 1 ? "game" : "games";
    const verb = n === 1 ? "is" : "are";
    tieNoteEl.textContent = `${n} ${gameWord} ended in a tie and ${verb} omitted from this week's scoring (${weekTies.join(", ")}).`;
    tieNoteEl.classList.remove("hidden");
  } else {
    tieNoteEl.classList.add("hidden");
  }

  // Brief shows under the chart regardless of which category tab is active —
  // it's tied to the selected week, not the selected category — so this
  // runs before the games/chart branch split below, not inside either one.
  // Preseason now shows a brief too (per Yeti, 2026-08-28 -- the
  // Commissioner's Report is meant to be testable as a full dress
  // rehearsal, same as Missing Picks/Weekly Digest already are), reading
  // from data/brief-week-preseason-3.json via the same loadRealBrief() as
  // any real week -- that function already just string-interpolates
  // whatever week it's given, so no change was needed there.
  const briefPanelEl = document.getElementById("briefPanel");
  briefPanelEl.classList.remove("hidden");
  const briefBodyEl = document.getElementById("briefBody");
  const briefWeekTagEl = document.getElementById("briefWeekTag");
  briefWeekTagEl.textContent = isPreseason ? "Preseason" : (isFinal ? "Week " + NUM_WEEKS + " — Final" : "Week " + currentWeek);
  const brief = await loadRealBrief(currentWeek);
  if (brief) {
    briefBodyEl.textContent = brief;
    briefBodyEl.className = "brief-body";
  } else {
    briefBodyEl.textContent = "Greg hasn't published a brief for this week yet.";
    briefBodyEl.className = "brief-body empty";
  }

  const chartPanel = document.getElementById("chartPanel");
  const gamesPanel = document.getElementById("gamesPanel");

  if (currentCat === "games") {
    chartPanel.style.display = "none";
    gamesPanel.className = "games-panel active";
    document.getElementById("catTitle").textContent = isPreseason ? "Preseason Week 3 games" : "Week " + currentWeek + " games";
    document.getElementById("catDesc").textContent = "Tap a game to see everyone's pick.";

    const realGames = await loadRealWeek(currentWeek);
    const gamesListEl = document.getElementById("gamesList");
    const gamesEmptyEl = document.getElementById("gamesEmpty");
    if (realGames && realGames.length > 0) {
      gamesListEl.classList.remove("hidden");
      gamesEmptyEl.classList.add("hidden");
      document.getElementById("legendNote").textContent = isPreseason
        ? "Live preseason NFL scores and real picks -- a full dress rehearsal, scored the same way a real week is."
        : "Live NFL scores and real picks for this week.";
      renderGames(realGames);
    } else {
      gamesListEl.classList.add("hidden");
      gamesListEl.innerHTML = "";
      gamesEmptyEl.classList.remove("hidden");
      gamesEmptyEl.textContent = "No games published for this week yet.";
      document.getElementById("legendNote").textContent = "";
    }
    return;
  }

  chartPanel.style.display = "";
  gamesPanel.className = "games-panel";

  const cat = CATEGORIES[currentCat];
  document.getElementById("catTitle").textContent = cat.title;
  document.getElementById("catDesc").textContent = cat.desc;

  const dataset = cat.getData(currentWeek);
  const wKey = String(currentWeek);

  const chartAreaEl = document.getElementById("chartArea");
  const chartEmptyEl = document.getElementById("chartEmpty");
  if (!dataset) {
    chartAreaEl.classList.add("hidden");
    chartEmptyEl.classList.remove("hidden");
    chartEmptyEl.textContent = "No " + cat.label.toLowerCase() + " data yet — check back once games are played.";
    document.getElementById("legendNote").textContent = "";
    return;
  }
  chartAreaEl.classList.remove("hidden");
  chartEmptyEl.classList.add("hidden");

  const barsArea = document.getElementById("barsArea");
  const yAxis = document.getElementById("yAxis");
  const labelsCols = document.getElementById("labelsCols");
  barsArea.innerHTML = ""; yAxis.innerHTML = ""; labelsCols.innerHTML = "";

  let values = {};
  let labels = {};
  let bottomLabels = {};

  if (cat.isBestWeek) {
    TEAMS.forEach(t => {
      const d = dataset[t][wKey];
      values[t] = d.pct;
      labels[t] = `${d.correct}-${d.total-d.correct}\n(Wk ${d.week})`;
      bottomLabels[t] = fmtPct(d.pct); // 3-digit -- the one exception (item 12)
    });
  } else if (cat.isHitsOpps) {
    TEAMS.forEach(t => {
      const d = dataset[t][wKey];
      values[t] = d.hits;
      labels[t] = `${d.hits}-${d.opps}`;
    });
  } else if (cat.isStandings) {
    // Reaching here means dataset came from getData() non-null, which for
    // this category only ever happens when hasRealStandingsForWeek() is
    // true (see CATEGORIES above) — so the matching pct source is
    // guaranteed set too (standings/standingsPct are always written
    // together, on both the real-season and preseason sides).
    const pctSource = realDataFor("standingsPct", currentWeek);
    TEAMS.forEach(t => {
      const v = dataset[t][wKey];
      values[t] = v;
      labels[t] = String(v);
      bottomLabels[t] = fmtPct2(pctSource[t][wKey]); // 2-digit (item 12)
    });
  } else {
    // Weeks Leading / Weekly Titles are real fractional point totals (tie-
    // split, e.g. 8.33) -- two decimals always, so a value that happens to
    // land on a whole number (e.g. 2) still shows "2.00", consistent with
    // "8.33" in the same column (item 12). 10-Win Weeks is a plain week
    // COUNT, not a fractional metric, so it's left as an integer -- flagged
    // in BUILD_LOG as a judgment call since it has no real data yet either
    // way to confirm against.
    TEAMS.forEach(t => {
      const v = dataset[t][wKey];
      values[t] = v;
      labels[t] = cat.unit === "pts" ? v.toFixed(2) : String(v);
    });
  }

  const maxVal = Math.max(...TEAMS.map(t => values[t]), 0.01);
  const ticks = 4;
  for (let i=ticks; i>=0; i--){
    const d = document.createElement("div");
    d.textContent = (maxVal/ticks*i).toFixed(2);
    yAxis.appendChild(d);
  }
  for (let i=1; i<ticks; i++){
    const line = document.createElement("div");
    line.className = "grid-line";
    line.style.bottom = (i/ticks*100)+"%";
    barsArea.appendChild(line);
  }

  // Leader icon for every category's current top value (item 9), shared by
  // every co-leader on an exact tie -- same rule Best Week already used,
  // now generalized instead of being Best-Week-only. Unique Hits gets a
  // grey raccoon face instead of a crown -- a deliberate nod to Ruth Cote
  // ("Ruth's Raccoons"), PFPI's all-time Unique Hits leader; not a bug if
  // it looks different from every other category's crown. Swapped from an
  // earlier coon-skin-hat icon to this raccoon face per Yeti (2026-08-26,
  // "let's swap those out for a raccoon... maybe a grey raccoon").
  const topValue = Math.max(...TEAMS.map(t => values[t]));
  // No crown/raccoon for anyone while a category is still an honest
  // all-zero state (per Yeti, 2026-08-28) -- a real leader hasn't emerged
  // yet, so nobody should look like one. Once at least one team has a real
  // nonzero value, the existing tie-sharing rule below is unchanged.
  const leaderTeams = topValue > 0 ? TEAMS.filter(t => values[t] === topValue) : [];
  const isRaccoon = currentCat === "uniqueHits";
  const leaderIconHtml = isRaccoon
    ? `<div class="raccoon-icon">${raccoonSvg(24)}</div>`
    : '<div class="crown">&#128081;</div>';

  // Dynamic bar sorting (item 8, reverses the earlier locked "fixed order"
  // decision per Greg via Yeti): ranked by this category's value, highest
  // first, alphabetical by team name on an exact tie. Recomputed every
  // render() call, so it re-sorts as the selected week changes.
  const sortedTeams = [...TEAMS].sort((a, b) => {
    if (values[b] !== values[a]) return values[b] - values[a];
    return TEAM_SHORT[a].localeCompare(TEAM_SHORT[b]);
  });

  sortedTeams.forEach(team => {
    const val = values[team];
    const pct = Math.max(3, Math.round((val/maxVal)*1000)/10);
    const color = TEAM_COLORS[team];
    const isLeader = leaderTeams.includes(team);
    const bottomLabel = bottomLabels[team];

    // Two-tone split: derived directly from `pct`, the exact same value
    // that sets .bar-el's own height below -- never computed separately,
    // so the color boundary can't drift out of sync with the bar's real
    // fill line. See the .bar-mascot-label CSS comment for the full
    // reasoning on why the gradient stop is `100 - pct` (not `pct`) given
    // the rotate(180deg) this element also carries.
    const mascotGradient = `linear-gradient(0deg, ${MASCOT_ABOVE_BAR_COLOR} 0%, ${MASCOT_ABOVE_BAR_COLOR} ${100 - pct}%, ${MASCOT_IN_BAR_COLOR} ${100 - pct}%, ${MASCOT_IN_BAR_COLOR} 100%)`;

    const col = document.createElement("div");
    col.className = "bar-col" + (isLeader ? " is-champion" : "");
    col.innerHTML = `
      <div class="bar-mascot-label" style="background-image:${mascotGradient}">${team.toUpperCase()}</div>
      <div class="bar-el" style="height:${pct}%;background:${color}">
        <div class="bar-value-label">
          ${isLeader ? leaderIconHtml : ""}
          <div>${labels[team].replace("\n","<br>")}</div>
        </div>
        ${bottomLabel ? `<div class="bar-bottom-label">${bottomLabel}</div>` : ""}
      </div>
    `;
    barsArea.appendChild(col);

    const labelCol = document.createElement("div");
    labelCol.className = "label-col";
    labelCol.innerHTML = `
      <div class="bar-team-avatar" style="border-color:${color};color:${color}">${initials(TEAM_SHORT[team])}</div>
      <div class="bar-team-name">${TEAM_SHORT[team]}</div>
    `;
    labelsCols.appendChild(labelCol);
  });

  sizeMascotLabels(barsArea);

  // Every category reaching this point already passed the !dataset early
  // return above, so this is always real data, never a placeholder.
  document.getElementById("legendNote").textContent =
    "Live data. Bars are sorted by rank in this category (highest first); ties break alphabetically.";
}

// Item 10/two-tone redesign (2026-08-26): mascot lettering size is now
// independent of the bar's own height entirely -- the label is a child of
// .bar-col (the fixed-height card), not .bar-el (the shrinking fill), so
// every bar gets the SAME generous, legible size (the bar-height-based 12%
// floor + 6-11px clamp this used to need is gone -- the actual bar-height
// floor is back down near its original 3%, see render()). Still measured
// via getBoundingClientRect() rather than hardcoded, so it stays correct
// across the desktop/mobile plot-row height breakpoint without duplicating
// that number here.
// Width cap added 2026-08-27, per Yeti (real bug on his OnePlus 13R,
// reproduced and confirmed here at real narrow viewport widths): this
// function used to size purely off the bar-col's HEIGHT, with no regard
// for its WIDTH at all. `.bar-mascot-label` is 1.3em wide (see its own CSS
// comment), so on a wide desktop column that was never a problem -- but on
// a narrow mobile column (8 columns can shrink to ~17-20px each), the
// height-based font-size still came out large enough that 1.3em exceeded
// the column's actual width. Since `.bars-area`/`.chart-panel` deliberately
// use overflow:visible (so crowns/value-labels can float above the bars),
// that overflow wasn't clipped -- it pushed the whole page wider than the
// viewport, forcing real horizontal scroll (measured: docScrollWidth >
// docClientWidth at 320px width, label 19.5px wide inside a 17.4px
// column). Fix: also cap the font-size so the label's own box (1.3 *
// fontSize) never exceeds the column's real width, whichever constraint
// (height or width) is tighter.
function sizeMascotLabels(barsArea) {
  barsArea.querySelectorAll(".bar-mascot-label").forEach(el => {
    const barCol = el.closest(".bar-col");
    const rect = barCol.getBoundingClientRect();
    const available = rect.height * 0.82;
    const heightBasedSize = available / (el.textContent.length * 1.05);
    const widthBasedSize = rect.width / 1.3;
    const size = Math.max(9, Math.min(15, heightBasedSize, widthBasedSize));
    el.style.fontSize = size + "px";
  });
}

let expandedGameIdx = null;

// Highlightly (preseason) gives a real kickoff timestamp; Big Balls
// (regular season) only gives a real calendar date, anchored to a
// placeholder noon-UTC time for deadline math (see worker.js's gap
// notice) — hasRealTime tells these apart so a fabricated time is never
// shown for regular-season games, only a real one for preseason.
function formatKickoff(g) {
  if (!g.kickoffISO) return null;
  const d = new Date(g.kickoffISO);
  const opts = g.hasRealTime
    ? { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }
    : { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric" };
  return new Intl.DateTimeFormat("en-US", opts).format(d) + (g.hasRealTime ? " ET" : "");
}

// Same "locked" definition as shared.js's isGameLocked() (this plain page
// has no module import, so it's inlined rather than sharing that file) --
// `g.deadline` is worker.js's own computeGameDeadline() result, already
// published on every game object (regular-season via buildWeekPublicJSON,
// preseason via its own merge step in pollAndPublish -- both paths added
// it, 2026-08-29, specifically so this check works uniformly everywhere).
// Missing deadline defaults to NOT locked -- safer to under-reveal a
// unique pick than to guess a game is locked when it might not be.
function isGameLocked(g) {
  return !!g.deadline && Date.now() > new Date(g.deadline).getTime();
}

// Only ever called with real, non-empty game data (render() shows the empty
// state itself otherwise) — see BUILD_LOG.md for the 2025-sim archival that
// removed the simulated-schedule fallback this used to have.
function renderGames(realGames){
  const gamesList = document.getElementById("gamesList");
  gamesList.innerHTML = "";

  // Real data (worker.js) carries confirmed home/away from Big Balls' game_id
  // format, so this is accurate, not a known limitation. See BUILD_LOG.md.
  // Sorted chronologically by kickoff -- neither Big Balls nor Highlightly
  // guarantee return order, per Yeti (2026-08-25, caught Aug 29's slate
  // showing before Aug 27's on the Preseason view).
  const sortedGames = [...realGames].sort((a, b) => new Date(a.kickoffISO) - new Date(b.kickoffISO));
  sortedGames.forEach((g, idx) => {
    const isExpanded = expandedGameIdx === idx;
    const card = document.createElement("div");
    card.className = "game-card" + (isExpanded ? " expanded" : "");

    const isFinal = g.status === "final";
    const isTie = isFinal && !!g.tie;
    const homeWon = isFinal && g.winner === g.home;
    const awayWon = isFinal && g.winner === g.away;
    const statusLabel = g.status === "final" ? "Final"
      : g.status === "in_progress" ? "Live"
      : (formatKickoff(g) || "Upcoming");
    const homeDisplay = g.homeScore ?? (isFinal ? "" : "-");
    const awayDisplay = g.awayScore ?? (isFinal ? "" : "-");

    const row = document.createElement("div");
    row.className = "game-row";
    row.innerHTML = `
      <div class="game-matchup">
        <div class="game-team${awayWon ? " winner" : ""}">${g.away}</div>
        <div class="game-score">${awayDisplay}</div>
        <div class="game-at"></div>
        <div class="game-score">${homeDisplay}</div>
        <div class="game-team${homeWon ? " winner" : ""}">${g.home}</div>
      </div>
      <div class="game-status${isFinal ? " final" : ""}${isTie ? " tie" : ""}">${statusLabel}${
        // Live game clock (added 2026-08-27, per Yeti): only ever populated
        // for in_progress preseason games via Highlightly's own
        // state.report field (see normalizeHighlightlyGame, worker.js) --
        // reflects whatever was true as of the last poll, not a real-time
        // ticking clock, hence "as of" rather than implying second-by-
        // second accuracy.
        g.status === "in_progress" && g.clockReport ? `<div class="game-clock">${g.clockReport}</div>` : ""
      }${
        // Per-game tie flag (added 2026-08-31, per Yeti): a tied final game
        // is nullified for pick'em purposes entirely (see worker.js's
        // normalizeGame() comment) -- this makes that visible right on the
        // game itself, not just as a week-level aggregate note on the chart
        // tabs (see the separate #tieNote element above).
        isTie ? `<div class="game-tie-flag">Tie — not counted toward PFPI scoring</div>` : ""
      }</div>
      <div class="game-expand-icon">&#9660;</div>
    `;
    row.onclick = () => {
      expandedGameIdx = isExpanded ? null : idx;
      renderGames(realGames);
    };
    card.appendChild(row);

    if (isExpanded) {
      const breakdown = document.createElement("div");
      breakdown.className = "picks-breakdown";
      const grid = document.createElement("div");
      grid.className = "picks-grid";

      // Unique-pick badge (2026-08-29, per Yeti): "a raccoon head beside
      // any pick that is a unique pick," same raccoon as the Unique Hits
      // leaderboard, once the game is locked -- NOT before. Same
      // definition worker.js's own Unique Hits computation already uses
      // ("among the TEAMS that actually picked that game, exactly one
      // team chose that side"), computed fresh here from this game's own
      // real picks rather than duplicating worker.js's per-week aggregate
      // (that's a cumulative hits/opps count, not a per-game flag -- a
      // different shape, not reusable directly).
      //
      // Deliberately gated on isGameLocked(g), NOT on isFinal: the raw
      // pick values are already publicly visible before a game locks (see
      // buildWeekPublicJSON, worker.js -- an existing, unrelated design
      // this doesn't change), but flagging ONE of those visible picks as
      // "the only one who picked this side" is a genuine spoiler while
      // other teams can still submit or change their own pick for this
      // same game -- it would hand later-deciding teams free strategic
      // information. Once locked, every team's pick for THIS SPECIFIC
      // game is frozen (this system's deadlines are per-game, not
      // per-week -- a locked game's picks can never change regardless of
      // whether other games that week are still open), so revealing
      // uniqueness at that point is safe. Not tied to the game being
      // final/decided -- the whole point, per Yeti, is to draw fans into
      // watching a game they might otherwise skip, which only works
      // before it's already over.
      const locked = isGameLocked(g);
      const pickCounts = {};
      if (locked && g.picks) {
        TEAMS.forEach(team => {
          const p = g.picks[team];
          if (p) pickCounts[p] = (pickCounts[p] || 0) + 1;
        });
      }

      TEAMS.forEach(team => {
        // Preseason games (Highlightly) DO carry a real picks object (added
        // 2026-08-27) -- guarded rather than assumed only because older
        // cached preseason data (from before that date) won't have it.
        const pick = (g.picks && g.picks[team]) || null;
        const correct = (pick && isFinal) ? pick === g.winner : null;
        const isUnique = locked && pick && pickCounts[pick] === 1;
        const color = TEAM_COLORS[team];
        const chip = document.createElement("div");
        chip.className = "pick-chip " + (correct === null ? "" : correct ? "correct" : "incorrect");
        chip.innerHTML = `
          <div class="pick-avatar" style="border-color:${color};color:${color}">${initials(TEAM_SHORT[team])}</div>
          <div class="pick-info">
            <div class="pick-team-name">${TEAM_SHORT[team]}</div>
            <div class="pick-choice-row">
              <div class="pick-choice ${correct === null ? "" : correct ? "correct-text" : "incorrect-text"}">${pick || "No pick yet"}</div>
              ${isUnique ? `<div class="pick-raccoon-icon" title="Unique pick">${raccoonSvg(16)}</div>` : ""}
            </div>
          </div>
        `;
        grid.appendChild(chip);
      });
      breakdown.appendChild(grid);
      card.appendChild(breakdown);
    }

    gamesList.appendChild(card);
  });
}

render();       // instant paint with honest empty states, no flash of blank content
initRealData(); // then swap in real data where it exists (mostly a no-op
                 // until the 2026 season actually has games/results)
</script>
</body>
</html>
