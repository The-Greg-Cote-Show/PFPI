<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFPI Brief | The Greg Cote Show</title>
<style>
:root {
  --bg:#080c14; --panel:#0f1623; --panel2:#141d2e; --panel3:#1a2540;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --gold:#e8b84b; --gold2:#f5d07a; --red:#e05252; --green:#3ecf74; --blue:#4a9eff;
  --text:#eef2f7; --muted:#7a8ba8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;font-size:15px;}

.wrap{max-width:560px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}

.title-main{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;}
.title-main span{color:var(--gold);}
.title-sub{font-size:.7rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;margin-bottom:2rem;}

.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:1.75rem;}

.field{margin-bottom:1.25rem;}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:.5rem;}
.field input[type=password],
.field input[type=text],
.field select,
.field textarea{
  width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;
  color:var(--text);font-size:.95rem;padding:.7rem .85rem;font-family:inherit;
}
.field textarea{min-height:220px;resize:vertical;line-height:1.5;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);}
.field input[readonly]{opacity:.6;cursor:default;}

.btn{
  background:var(--gold);color:#1a1305;border:none;border-radius:8px;
  font-size:.9rem;font-weight:800;padding:.75rem 1.5rem;cursor:pointer;width:100%;
}
.btn:hover{background:var(--gold2);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.status{font-size:.8rem;margin-top:1rem;padding:.7rem .9rem;border-radius:8px;display:none;}
.status.show{display:block;}
.status.ok{background:rgba(62,207,116,.12);color:var(--green);border:1px solid rgba(62,207,116,.3);}
.status.err{background:rgba(224,82,82,.12);color:var(--red);border:1px solid rgba(224,82,82,.3);}
.status.warn{background:rgba(232,184,75,.12);color:var(--gold);border:1px solid rgba(232,184,75,.3);}

.gate-note{font-size:.72rem;color:var(--muted);margin-top:1rem;text-align:center;}
.forgot-link{font-size:.75rem;text-align:center;margin-top:.85rem;}
.forgot-link a{color:var(--blue);}

#publishScreen,#resetScreen,#dashboardTabs,#missingPicksScreen,#digestScreen{display:none;}
.hidden{display:none !important;}

.char-count{font-size:.68rem;color:var(--muted);text-align:right;margin-top:.35rem;}

.dash-tabs{display:flex;gap:6px;margin-bottom:1rem;}
.dash-tab-btn{flex:1;background:var(--panel2);border:1px solid var(--border2);color:var(--muted);font-size:.78rem;font-weight:700;padding:.6rem .5rem;border-radius:8px;cursor:pointer;}
.dash-tab-btn.active{background:var(--gold);color:#1a1305;border-color:var(--gold);}

.toggle-row{display:flex;gap:8px;margin-bottom:1.25rem;}
.toggle-btn{background:var(--panel2);border:1px solid var(--border2);color:var(--muted);font-size:.78rem;font-weight:700;padding:.5rem .9rem;border-radius:8px;cursor:pointer;}
.toggle-btn.active{background:var(--panel3);color:var(--gold);border-color:var(--gold);}

.mp-row{background:var(--panel2);border:1px solid var(--border2);border-radius:10px;padding:.75rem .9rem;margin-bottom:.6rem;}
.mp-row-header{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;margin-bottom:.5rem;flex-wrap:wrap;}
.mp-matchup{font-size:.85rem;font-weight:700;}
.mp-deadline{font-size:.7rem;color:var(--blue);white-space:nowrap;}
.mp-deadline.mp-locked{color:var(--muted);}
.mp-chips{display:flex;flex-wrap:wrap;gap:6px;}
.mp-chip{background:var(--panel3);border:1px solid rgba(224,82,82,.35);color:var(--red);font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:6px;}
.mp-chip-locked{border-color:var(--border2);color:var(--muted);}
.mp-all-picked{color:var(--green);font-size:.78rem;font-weight:600;}

.digest-output{
  width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;
  color:var(--text);font-size:.78rem;line-height:1.5;padding:.85rem;
  font-family:"SF Mono",Consolas,"Courier New",monospace;white-space:pre;resize:vertical;
  margin-bottom:.85rem;
}
.digest-actions{display:flex;gap:8px;}
.digest-btn{width:auto;flex:1;font-size:.8rem;padding:.6rem 1rem;}
</style>
</head>
<body>

<div class="wrap">
  <div class="title-main">PFPI <span>Brief</span></div>
  <div class="title-sub">Weekly publisher &bull; The Greg Cote Show</div>

  <div class="card" id="gateScreen">
    <form id="gateForm">
      <div class="field">
        <label for="username">Account</label>
        <input type="text" id="username" name="username" value="PFPI Commissioner" readonly autocomplete="username">
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input type="password" id="pw" name="password" autocomplete="current-password" placeholder="Enter password">
      </div>
      <button class="btn" type="submit" id="unlockBtn">Unlock</button>
    </form>
    <div class="status err" id="gateStatus"></div>
    <div class="forgot-link"><a href="#" id="forgotBtn">Forgot password?</a></div>
    <div class="gate-note">Your browser can save this password so you won't need to type it again.</div>
  </div>

  <div class="card" id="resetScreen">
    <form id="resetForm">
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" name="newPassword" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
      </div>
      <button class="btn" type="submit" id="resetBtn">Reset password</button>
    </form>
    <div class="status" id="resetStatus"></div>
  </div>

  <div class="dash-tabs" id="dashboardTabs">
    <button class="dash-tab-btn active" id="dashTabMissing" data-tab="missing">Missing Picks</button>
    <button class="dash-tab-btn" id="dashTabDigest" data-tab="digest">Weekly Digest</button>
    <button class="dash-tab-btn" id="dashTabPublish" data-tab="publish">Publish Brief</button>
  </div>

  <div class="card" id="missingPicksScreen">
    <div class="field">
      <label for="mpWeekSelect">Week</label>
      <select id="mpWeekSelect"></select>
    </div>
    <div class="toggle-row">
      <button class="toggle-btn active" id="mpByGameBtn">By game</button>
      <button class="toggle-btn" id="mpByTeamBtn">By team</button>
    </div>
    <div id="mpContent"></div>
    <div class="status" id="mpStatus"></div>
  </div>

  <div class="card" id="digestScreen">
    <div class="field">
      <label for="digestWeekSelect">Week</label>
      <select id="digestWeekSelect"></select>
    </div>
    <textarea id="digestOutput" class="digest-output" readonly rows="18"></textarea>
    <div class="digest-actions">
      <button class="btn digest-btn" id="digestCopyBtn" type="button">Copy to clipboard</button>
      <button class="btn digest-btn" id="digestInsertBtn" type="button">Insert into brief text</button>
    </div>
    <div class="status" id="digestStatus"></div>
  </div>

  <div class="card" id="publishScreen">
    <div class="field">
      <label for="weekSelect">Week</label>
      <select id="weekSelect"></select>
    </div>
    <div class="field">
      <label for="briefText">This week's brief</label>
      <textarea id="briefText" placeholder="Write this week's PFPI brief..."></textarea>
      <div class="char-count" id="charCount">0 characters</div>
    </div>
    <button class="btn" id="publishBtn">Publish brief</button>
    <div class="status" id="publishStatus"></div>
  </div>
</div>

<script>
const WORKER_BASE = "https://pfpi-picks-worker.yeti-f3c.workers.dev";
let sessionToken = null;

// Real 8-team roster only -- matches shared.js's TEAMS export. The 2 sandboxed
// test teams (Yeti's Big Feet, Gentry's Neanderbrows) are never in this list,
// so they're automatically excluded from the missing-picks tracker below.
const REAL_TEAMS = ["Lobos", "Roughriders", "Maniacs", "Critters", "Chickens", "Ferraris", "Llamas", "Giraffes"];
const TEAM_SHORT = {
  Lobos: "Greg's Lobos", Roughriders: "Dick's Roughriders", Maniacs: "Mom's Maniacs", Critters: "Chris' Critters",
  Chickens: "Mike's Chickens", Ferraris: "Christie's Ferraris", Llamas: "Tati's Llamas", Giraffes: "Gracelin's Giraffes",
};

// ============================================================
// LOGIN
// ============================================================

async function tryUnlock(e) {
  if (e) e.preventDefault();
  const pw = document.getElementById("pw").value;
  const statusEl = document.getElementById("gateStatus");

  if (!pw) {
    statusEl.textContent = "Enter the password first.";
    statusEl.className = "status err show";
    return;
  }

  statusEl.textContent = "Checking...";
  statusEl.className = "status show";
  try {
    const res = await fetch(`${WORKER_BASE}/greg/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw }),
    });
    const data = await res.json();
    if (!res.ok) {
      statusEl.textContent = data.error || "That password didn't work. Try again.";
      statusEl.className = "status err show";
      return;
    }
    sessionToken = data.sessionToken;
    document.getElementById("gateScreen").style.display = "none";
    document.getElementById("dashboardTabs").style.display = "flex";
    document.getElementById("missingPicksScreen").style.display = "block";
    await populateWeeks();
    await populateMissingPicksWeeks();
  } catch (e) {
    statusEl.textContent = "Could not reach the server.";
    statusEl.className = "status err show";
  }
}

document.getElementById("forgotBtn").addEventListener("click", async (e) => {
  e.preventDefault();
  const statusEl = document.getElementById("gateStatus");
  statusEl.textContent = "Sending reset link...";
  statusEl.className = "status show";
  try {
    const res = await fetch(`${WORKER_BASE}/greg/forgot-password`, { method: "POST" });
    if (!res.ok) {
      statusEl.textContent = "Could not send reset link.";
      statusEl.className = "status err show";
      return;
    }
    statusEl.textContent = "Reset link sent. It's valid for 30 minutes.";
    statusEl.className = "status ok show";
  } catch (e) {
    statusEl.textContent = "Could not reach the server.";
    statusEl.className = "status err show";
  }
});

// ============================================================
// PASSWORD RESET (only shown when the page is opened with ?resetToken=)
// ============================================================

const resetToken = new URLSearchParams(location.search).get("resetToken");
if (resetToken) {
  document.getElementById("gateScreen").style.display = "none";
  document.getElementById("resetScreen").style.display = "block";
}

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const statusEl = document.getElementById("resetStatus");

  if (newPassword !== confirmPassword) {
    statusEl.textContent = "Passwords don't match.";
    statusEl.className = "status err show";
    return;
  }

  statusEl.textContent = "Resetting...";
  statusEl.className = "status show";
  try {
    const res = await fetch(`${WORKER_BASE}/greg/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: resetToken, newPassword }),
    });
    const data = await res.json();
    if (!res.ok) {
      statusEl.textContent = data.error || "Reset failed.";
      statusEl.className = "status err show";
      return;
    }
    statusEl.textContent = "Password reset. You can log in now.";
    statusEl.className = "status ok show";
    setTimeout(() => { location.href = location.pathname; }, 1500);
  } catch (e) {
    statusEl.textContent = "Could not reach the server.";
    statusEl.className = "status err show";
  }
});

// ============================================================
// PUBLISH
// ============================================================

// Same shared current-week value the rest of the site uses (written by the
// scores worker into KV) — not recomputed or hardcoded here.
async function fetchCurrentWeek() {
  try {
    const res = await fetch(`${WORKER_BASE}/current-week`);
    if (!res.ok) return 1;
    const data = await res.json();
    return data.currentWeek || 1;
  } catch (e) {
    return 1;
  }
}

// TEMPORARY — for Yeti's testing (per PFPI_four_changes_handoff.md,
// 2026-08-25), so the brief publisher can be exercised across every week
// right now instead of only the current one. REVERT to `false` before
// real weekly use begins — the backend (POST /admin/publish-brief) never
// enforced current-week-only itself, so flipping this back is the only
// change needed to restore normal behavior.
const TESTING_ALLOW_ALL_WEEKS = true;
const NUM_WEEKS = 18;

async function populateWeeks() {
  const currentWeek = await fetchCurrentWeek();
  const maxWeek = TESTING_ALLOW_ALL_WEEKS ? NUM_WEEKS : currentWeek;
  const sel = document.getElementById("weekSelect");
  sel.innerHTML = "";
  // Normally only weeks up through the current week are selectable — Greg
  // can publish this week's brief or go back and fix a past one, but can't
  // accidentally pick a week that hasn't happened yet. See
  // TESTING_ALLOW_ALL_WEEKS above for why this is temporarily wider.
  for (let w = 1; w <= maxWeek; w++) {
    const opt = document.createElement("option");
    opt.value = w;
    opt.textContent = "Week " + w;
    sel.appendChild(opt);
  }
  sel.value = currentWeek;
}

function updateCharCount() {
  const text = document.getElementById("briefText").value;
  document.getElementById("charCount").textContent = text.length + " characters";
}

async function publish() {
  const week = document.getElementById("weekSelect").value;
  const text = document.getElementById("briefText").value.trim();
  const statusEl = document.getElementById("publishStatus");
  const btn = document.getElementById("publishBtn");

  if (!text) {
    statusEl.textContent = "Write something before publishing.";
    statusEl.className = "status err show";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Publishing...";
  statusEl.textContent = "";
  statusEl.className = "status show";

  try {
    const res = await fetch(`${WORKER_BASE}/admin/publish-brief`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Session-Token": sessionToken },
      body: JSON.stringify({ week: parseInt(week, 10), text }),
    });
    const data = await res.json();
    btn.disabled = false;
    btn.textContent = "Publish brief";

    if (res.status === 202 && data.published === false) {
      statusEl.textContent = data.error;
      statusEl.className = "status warn show";
      return;
    }
    if (!res.ok) {
      statusEl.textContent = data.error || "Publish failed.";
      statusEl.className = "status err show";
      return;
    }
    statusEl.textContent = "Published for Week " + week + ". It's now live under that week's chart.";
    statusEl.className = "status ok show";
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Publish brief";
    statusEl.textContent = "Could not reach the server.";
    statusEl.className = "status err show";
  }
}

// ============================================================
// MISSING-PICKS TRACKER
// ============================================================

let mpView = "byGame";
const mpGamesCache = {};

// Pulls the same public data/week-N.json games+picks that index.html's
// Games tab already reads -- no separate calculation, just a different view
// of who's missing rather than who's already in. `deadline` on each game
// comes from worker.js's buildWeekPublicJSON, which calls the same
// computeGameDeadline() the picks worker uses for /my-picks -- not a second
// deadline calculation.
async function fetchWeekGames(week) {
  if (mpGamesCache[week] !== undefined) return mpGamesCache[week];
  try {
    const res = await fetch(`data/week-${week}.json?t=${Date.now()}`);
    if (!res.ok) { mpGamesCache[week] = null; return null; }
    const data = await res.json();
    mpGamesCache[week] = Array.isArray(data.games) ? data.games : null;
    return mpGamesCache[week];
  } catch (e) {
    mpGamesCache[week] = null;
    return null;
  }
}

async function populateMissingPicksWeeks() {
  const currentWeek = await fetchCurrentWeek();
  const sel = document.getElementById("mpWeekSelect");
  sel.innerHTML = "";
  for (let w = 1; w <= currentWeek; w++) {
    const opt = document.createElement("option");
    opt.value = w;
    opt.textContent = "Week " + w;
    sel.appendChild(opt);
  }
  sel.value = currentWeek;
  await renderMissingPicks();
}

// `deadline` is a recent addition to data/week-N.json (worker.js) -- guard
// against a stale cached file from before that field existed (GitHub Pages
// commit-to-CDN propagation lag is untested/variable, see index.html) rather
// than let an invalid Date throw inside Intl.DateTimeFormat.
function fmtDeadline(iso) {
  const d = iso ? new Date(iso) : null;
  if (!d || isNaN(d.getTime())) return "TBD";
  return new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit",
  }).format(d) + " ET";
}

function isPastDeadline(iso) {
  if (!iso) return false;
  const t = new Date(iso).getTime();
  return !isNaN(t) && t < Date.now();
}

async function renderMissingPicks() {
  const contentEl = document.getElementById("mpContent");
  const statusEl = document.getElementById("mpStatus");
  const week = parseInt(document.getElementById("mpWeekSelect").value, 10);

  contentEl.innerHTML = "";
  statusEl.textContent = "Loading...";
  statusEl.className = "status show";

  const games = await fetchWeekGames(week);
  if (!games || games.length === 0) {
    statusEl.textContent = "No games published for this week yet.";
    statusEl.className = "status show";
    return;
  }
  statusEl.textContent = "";
  statusEl.className = "status";

  // Soonest deadline first, in both views. Missing/invalid deadlines (see
  // fmtDeadline's note) sort last rather than corrupting the order.
  const deadlineMs = g => { const t = new Date(g.deadline).getTime(); return isNaN(t) ? Infinity : t; };
  const sorted = [...games].sort((a, b) => deadlineMs(a) - deadlineMs(b));

  if (mpView === "byGame") {
    contentEl.innerHTML = sorted.map(g => {
      const missing = REAL_TEAMS.filter(t => !(g.picks && g.picks[t]));
      const locked = isPastDeadline(g.deadline);
      const chipsHtml = missing.length === 0
        ? `<span class="mp-all-picked">Everyone's picked</span>`
        : missing.map(t => `<span class="mp-chip${locked ? " mp-chip-locked" : ""}">${TEAM_SHORT[t]}</span>`).join("");
      return `
        <div class="mp-row">
          <div class="mp-row-header">
            <span class="mp-matchup">${g.away} @ ${g.home}</span>
            <span class="mp-deadline${locked ? " mp-locked" : ""}">${locked ? "Deadline passed" : fmtDeadline(g.deadline)}</span>
          </div>
          <div class="mp-chips">${chipsHtml}</div>
        </div>
      `;
    }).join("");
  } else {
    // Team order stays fixed (REAL_TEAMS), matching the "never re-sorted"
    // convention index.html's charts already use -- only each team's list of
    // missing games is sorted by urgency.
    contentEl.innerHTML = REAL_TEAMS.map(team => {
      const missingGames = sorted.filter(g => !(g.picks && g.picks[team]));
      const gamesHtml = missingGames.length === 0
        ? `<span class="mp-all-picked">All picked</span>`
        : missingGames.map(g => {
            const locked = isPastDeadline(g.deadline);
            return `<span class="mp-chip${locked ? " mp-chip-locked" : ""}">${g.away} @ ${g.home} — ${locked ? "deadline passed" : fmtDeadline(g.deadline)}</span>`;
          }).join("");
      return `
        <div class="mp-row">
          <div class="mp-row-header"><span class="mp-matchup">${TEAM_SHORT[team]}</span></div>
          <div class="mp-chips">${gamesHtml}</div>
        </div>
      `;
    }).join("");
  }
}

document.getElementById("mpWeekSelect").addEventListener("change", renderMissingPicks);
document.getElementById("mpByGameBtn").addEventListener("click", () => {
  mpView = "byGame";
  document.getElementById("mpByGameBtn").classList.add("active");
  document.getElementById("mpByTeamBtn").classList.remove("active");
  renderMissingPicks();
});
document.getElementById("mpByTeamBtn").addEventListener("click", () => {
  mpView = "byTeam";
  document.getElementById("mpByTeamBtn").classList.add("active");
  document.getElementById("mpByGameBtn").classList.remove("active");
  renderMissingPicks();
});

// ============================================================
// WEEKLY DIGEST — a stats scaffold matching Greg's real house style, pulled
// from the same real computed data the public charts use (worker.js's
// computeStandings). Standings, Weekly Titles, Weeks Leading, and Best Week
// are real; 10-Win Weeks and Unique Hits have no real data source at all
// (see BUILD_LOG.md) and show an honest "not available" line instead of a
// fabricated number.
// ============================================================

const SEASON_YEAR = 2026;
let standingsData = null; // raw data/standings.json, cached after first fetch

async function fetchStandingsData() {
  if (standingsData !== null) return standingsData;
  try {
    const res = await fetch(`data/standings.json?t=${Date.now()}`);
    if (!res.ok) return null;
    const data = await res.json();
    standingsData = (data && data.standings) ? data : null;
    return standingsData;
  } catch (e) {
    return null;
  }
}

// Same formatting rule as index.html's fmtPct (duplicated intentionally --
// it's a formatting helper, not scoring logic, and this is a separate page).
function fmtPct(v) {
  const s = v.toFixed(3);
  return s === "1.000" ? "1.000" : s.replace(/^0/, "");
}

async function populateDigestWeeks() {
  const currentWeek = await fetchCurrentWeek();
  const sel = document.getElementById("digestWeekSelect");
  sel.innerHTML = "";
  for (let w = 1; w <= currentWeek; w++) {
    const opt = document.createElement("option");
    opt.value = w;
    opt.textContent = "Week " + w;
    sel.appendChild(opt);
  }
  sel.value = currentWeek;
  await renderDigest();
}

// Standings block: sorted by wins descending, GB column, ties show "--".
// GB simplifies to (leader's wins - this team's wins) because every team
// has played the exact same games (a shared pick'em slate, not independent
// schedules like real MLB standings), so losses move in exact lockstep with
// wins -- the full "(winDiff + lossDiff)/2" formula and this reduce to the
// same integer here. Verified against Greg's real worked example (177/176/
// 175/175/168/160/156 wins -> GB 0/1/2/2/9/17/21) before relying on it.
function buildStandingsBlock(st, week, isFinal) {
  const wKey = String(week);
  const gp = (st.gamesPlayed && st.gamesPlayed[wKey]) || 0;
  const rows = REAL_TEAMS.map(t => {
    const wins = st.standings[t][wKey];
    return { team: t, wins, losses: gp - wins, pct: st.standingsPct[t][wKey] };
  });
  rows.sort((a, b) => b.wins - a.wins);
  const leaderWins = rows.length ? rows[0].wins : 0;

  const lines = [];
  lines.push(isFinal ? `PFPI OFFICIAL FINAL ${SEASON_YEAR} STANDINGS` : `PFPI STANDINGS THROUGH WEEK ${week} ${SEASON_YEAR}`);
  lines.push(`Team`.padEnd(32) + (isFinal ? "Final Season" : "Season").padEnd(13) + "GB");
  rows.forEach(r => {
    const name = TEAM_SHORT[r.team].padEnd(32);
    const record = `${r.wins}-${r.losses}`;
    const pct = fmtPct(r.pct);
    const gb = r.wins === leaderWins ? "--" : String(leaderWins - r.wins);
    lines.push(`${name}${record}   ${pct}${gb.padStart(6)}`);
  });
  return lines.join("\n");
}

// Weekly Titles / Weeks Leading block: "TEAM X.XX (N), Team X.XX (N), ...".
// Leader(s) at the max value are ALL CAPS (all of them, if tied for the
// literal top spot -- same "share the crown rather than arbitrarily pick
// one" precedent as Best Week's existing tie handling). Teams tied at the
// exact same cumulative value are joined with "&" and drop the "(N)" count,
// matching Greg's real example ("Llamas 0.33 & Roughriders 0.33") rather
// than the more generic prose description elsewhere in the handoff doc.
// Teams with zero (never held this honor) are omitted -- an unconfirmed but
// reasonable read of a real example that never shows a 0.00 entry; flagged
// in BUILD_LOG.md for Greg to correct if his real convention differs.
function buildPointBlock(label, dataObj, countObj, week) {
  const wKey = String(week);
  const entries = REAL_TEAMS
    .map(t => ({ team: t, value: dataObj[t][wKey], count: countObj[t][wKey] }))
    .filter(e => e.value > 0);

  if (entries.length === 0) return `${label}: No weeks decided yet.`;

  entries.sort((a, b) => b.value - a.value);
  const groups = [];
  for (const e of entries) {
    const last = groups[groups.length - 1];
    if (last && last[0].value === e.value) last.push(e);
    else groups.push([e]);
  }
  const maxValue = groups[0][0].value;

  const text = groups.map(group => {
    const tied = group.length > 1;
    return group.map(e => {
      const name = e.value === maxValue ? e.team.toUpperCase() : e.team;
      const valStr = e.value.toFixed(2);
      return tied ? `${name} ${valStr}` : `${name} ${valStr} (${e.count})`;
    }).join(" & ");
  }).join(", ");

  return `${label}: ${text}.`;
}

// Best Week block: "Best Week: Lobos .929 (13-1/W12)." Co-holders of an
// identical season-best pct share the line, joined with "&" -- same crown-
// sharing rule index.html's isBestWeek rendering already uses.
function buildBestWeekBlock(st, week) {
  const wKey = String(week);
  const entries = REAL_TEAMS
    .map(t => ({ team: t, ...st.bestWeek[t][wKey] }))
    .filter(e => e.total > 0);

  if (entries.length === 0) return "Best Week: No weeks decided yet.";

  const maxPct = Math.max(...entries.map(e => e.pct));
  const holders = entries.filter(e => e.pct === maxPct);
  const text = holders
    .map(e => `${e.team} ${fmtPct(e.pct)} (${e.correct}-${e.total - e.correct}/W${e.week})`)
    .join(" & ");
  return `Best Week: ${text}.`;
}

async function renderDigest() {
  const outputEl = document.getElementById("digestOutput");
  const statusEl = document.getElementById("digestStatus");
  const week = parseInt(document.getElementById("digestWeekSelect").value, 10);

  statusEl.textContent = "Loading...";
  statusEl.className = "status show";
  outputEl.value = "";

  const st = await fetchStandingsData();
  if (!st || !st.weeklyTitles || !st.weeksLeading || !st.bestWeek || !st.gamesPlayed) {
    // Missing new fields specifically (rather than the whole fetch failing)
    // means a stale cached data/standings.json from before this build --
    // same GitHub Pages propagation-lag gap noted elsewhere in this file.
    statusEl.textContent = "Digest data isn't available yet — check back in a few minutes.";
    statusEl.className = "status show";
    return;
  }
  statusEl.textContent = "";
  statusEl.className = "status";

  const isFinal = week === NUM_WEEKS;
  const parts = [
    buildStandingsBlock(st, week, isFinal),
    buildPointBlock("Weeks Leading", st.weeksLeading, st.weeksLeadingCount, week),
    buildPointBlock("Weekly Titles", st.weeklyTitles, st.weeklyTitlesCount, week),
    "10-Win Weeks: Not available yet — no real data source for this category.",
    "Unique Hits: Not available yet — no real data source for this category.",
    buildBestWeekBlock(st, week),
  ];
  outputEl.value = parts.join("\n\n");
}

document.getElementById("digestWeekSelect").addEventListener("change", renderDigest);

document.getElementById("digestCopyBtn").addEventListener("click", async () => {
  const statusEl = document.getElementById("digestStatus");
  const text = document.getElementById("digestOutput").value;
  try {
    await navigator.clipboard.writeText(text);
    statusEl.textContent = "Copied to clipboard.";
    statusEl.className = "status ok show";
  } catch (e) {
    // Clipboard API can be blocked in some contexts -- fall back to a
    // manual select so the user can still Ctrl/Cmd+C it themselves.
    const outputEl = document.getElementById("digestOutput");
    outputEl.focus();
    outputEl.select();
    statusEl.textContent = "Couldn't copy automatically -- text is selected, press Ctrl/Cmd+C.";
    statusEl.className = "status warn show";
  }
});

document.getElementById("digestInsertBtn").addEventListener("click", () => {
  document.getElementById("briefText").value = document.getElementById("digestOutput").value;
  updateCharCount();
  document.querySelectorAll("#dashboardTabs .dash-tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("dashTabPublish").classList.add("active");
  document.getElementById("missingPicksScreen").style.display = "none";
  document.getElementById("digestScreen").style.display = "none";
  document.getElementById("publishScreen").style.display = "block";
});

document.querySelectorAll("#dashboardTabs .dash-tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#dashboardTabs .dash-tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.getElementById("missingPicksScreen").style.display = tab === "missing" ? "block" : "none";
    document.getElementById("digestScreen").style.display = tab === "digest" ? "block" : "none";
    document.getElementById("publishScreen").style.display = tab === "publish" ? "block" : "none";
    if (tab === "digest" && !digestInitialized) {
      digestInitialized = true;
      populateDigestWeeks();
    }
  });
});

document.getElementById("gateForm").addEventListener("submit", tryUnlock);
document.getElementById("briefText").addEventListener("input", updateCharCount);
document.getElementById("publishBtn").addEventListener("click", publish);
</script>
