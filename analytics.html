<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFPI Analytics | The Greg Cote Show</title>
<style>
:root {
  --bg:#080c14; --panel:#0f1623; --panel2:#141d2e; --panel3:#1a2540;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --gold:#e8b84b; --gold2:#f5d07a; --red:#e05252; --green:#3ecf74; --blue:#4a9eff;
  --text:#eef2f7; --muted:#7a8ba8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;font-size:14px;}
.wrap{max-width:520px;margin:0 auto;padding:2rem 1.25rem 3rem;}
.title-main{font-size:1.3rem;font-weight:800;margin-bottom:1.25rem;}
.title-main span{color:var(--gold);}
label{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:.85rem 0 .3rem;}
input{width:100%;background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:.6rem .7rem;border-radius:8px;font-size:.85rem;}
button{margin-top:1.1rem;background:var(--blue);border:none;color:#08111f;font-weight:700;padding:.65rem 1.1rem;border-radius:8px;cursor:pointer;font-size:.82rem;}
button:hover{opacity:.9;}
.status{font-size:.75rem;margin-top:.75rem;min-height:1em;}
.status.error{color:var(--red);}
.status.ok{color:var(--green);}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-top:1.5rem;}
.hidden{display:none !important;}
.footer-copyright{text-align:center;font-size:.7rem;color:var(--muted);margin-top:2rem;}

/* Dashboard-only styles below -- wider layout than the login form. The
   dashboard's own internal styles (.pa-*) come from analytics-shared.js,
   this page only owns the login gate + outer wrapper widths. */
.dash-wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.5rem 3rem;}
.dash-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem;}
</style>
</head>
<body>
<div class="wrap" id="loginWrap">
  <div class="title-main">PFPI <span>Analytics</span></div>

  <div class="panel" id="loginPanel">
    <form id="loginForm">
      <label for="username">Account</label>
      <input type="text" id="username" name="username" value="PFPI Admin" readonly autocomplete="username">
      <label for="password">Admin password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit" id="loginBtn">Log in</button>
    </form>
    <div class="status" id="loginStatus"></div>
  </div>
  <div class="footer-copyright">&copy;ThatKindaThing Productions, LLC</div>
</div>

<div class="dash-wrap hidden" id="dashWrap">
  <div class="dash-header">
    <div class="title-main" style="margin-bottom:0;">PFPI <span>Analytics</span></div>
  </div>
  <div id="analyticsMount"></div>
  <div class="footer-copyright">&copy;ThatKindaThing Productions, LLC</div>
</div>

<script src="analytics-shared.js"></script>
<script>
const WORKER_BASE = "https://pfpi-picks-worker.yeti-f3c.workers.dev";
const SCORES_WORKER_BASE = "https://pfpi-scores-worker.yeti-f3c.workers.dev";
const SESSION_STORAGE_KEY = "pfpi-admin-session-token";
let sessionToken = null;
let dashboard = null;

function showLoggedIn() {
  document.getElementById("loginWrap").classList.add("hidden");
  document.getElementById("dashWrap").classList.remove("hidden");
  if (!dashboard) {
    dashboard = PFPIAnalytics.mount(document.getElementById("analyticsMount"), {
      scoresWorkerBase: SCORES_WORKER_BASE,
      getToken: () => sessionToken,
      onUnauthorized: () => clearSession("Your session expired — please log in again."),
    });
  }
}

function clearSession(message) {
  sessionToken = null;
  localStorage.removeItem(SESSION_STORAGE_KEY);
  document.getElementById("loginWrap").classList.remove("hidden");
  document.getElementById("dashWrap").classList.add("hidden");
  if (message) {
    const statusEl = document.getElementById("loginStatus");
    statusEl.textContent = message;
    statusEl.className = "status error";
  }
}

async function restoreSessionIfSaved() {
  const saved = localStorage.getItem(SESSION_STORAGE_KEY);
  if (!saved) return;
  try {
    const res = await fetch(`${WORKER_BASE}/verify-session?kind=admin`, {
      headers: { "X-Session-Token": saved },
    });
    const data = await res.json();
    if (data.valid) {
      sessionToken = saved;
      showLoggedIn();
    } else {
      localStorage.removeItem(SESSION_STORAGE_KEY);
    }
  } catch (e) {
    // Network error -- leave the login gate showing rather than guess.
  }
}

document.getElementById("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  const password = document.getElementById("password").value;
  const statusEl = document.getElementById("loginStatus");
  statusEl.textContent = "Logging in...";
  statusEl.className = "status";
  try {
    const res = await fetch(`${WORKER_BASE}/admin/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok) {
      statusEl.textContent = data.error || "Login failed.";
      statusEl.className = "status error";
      return;
    }
    sessionToken = data.sessionToken;
    localStorage.setItem(SESSION_STORAGE_KEY, sessionToken);
    showLoggedIn();
  } catch (e) {
    statusEl.textContent = "Could not reach the server.";
    statusEl.className = "status error";
  }
};

restoreSessionIfSaved();
</script>
</body>
</html>
