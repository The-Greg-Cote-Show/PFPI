<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFPI 2026 | The Greg Cote Show</title>
<style>
:root {
  --bg:#080c14; --panel:#0f1623; --panel2:#141d2e; --panel3:#1a2540;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --gold:#e8b84b; --gold2:#f5d07a; --red:#e05252; --green:#3ecf74; --blue:#4a9eff;
  --text:#eef2f7; --muted:#7a8ba8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;font-size:14px;}

.header{background:var(--panel);border-bottom:1px solid var(--border2);padding:1rem 1.5rem;position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;margin-bottom:.75rem;}
.title-main{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
.title-main span{color:var(--gold);}
.title-sub{font-size:.65rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}

.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:10px;overflow-x:auto;max-width:100%;}
.tab-btn{background:none;border:none;color:var(--muted);font-size:.72rem;font-weight:600;padding:7px 12px;border-radius:7px;cursor:pointer;transition:all .15s;white-space:nowrap;letter-spacing:.02em;flex-shrink:0;}
.tab-btn.active{background:var(--panel3);color:var(--gold);}
.tab-btn:hover:not(.active){color:var(--text);}

.week-row{display:flex;gap:3px;overflow-x:auto;padding:3px 0;}
.week-row::-webkit-scrollbar{height:5px;}
.week-row::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.week-btn{background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:.68rem;font-weight:600;padding:5px 10px;border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;min-width:38px;text-align:center;}
.week-btn.active{background:var(--blue);color:#08111f;border-color:var(--blue);}
.week-btn:hover:not(.active){color:var(--text);border-color:var(--border2);}
.week-btn.final{border-color:var(--gold);}
.week-btn.final.active{background:var(--gold);color:#08111f;}

.wrap{max-width:960px;margin:0 auto;padding:1.25rem 1.5rem 3rem;}

.empty-state{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:2.5rem 1.25rem;text-align:center;color:var(--muted);font-size:.85rem;font-style:italic;}
.tie-note{background:rgba(232,184,75,.1);border:1px solid rgba(232,184,75,.3);border-radius:10px;padding:.65rem 1rem;margin-bottom:1rem;font-size:.78rem;color:var(--gold2);line-height:1.5;}
.hidden{display:none !important;}
/* chart-panel's own padding is tuned for the bar chart's floating value
   labels above each bar — pull the empty state back up so it isn't
   oddly top-heavy when there's no chart to make room for. */
#chartEmpty{margin-top:-3.35rem;}

.category-header{margin-bottom:1rem;display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;}
.category-title{font-size:1.05rem;font-weight:800;}
.category-desc{font-size:.78rem;color:var(--muted);margin-top:2px;}
.week-label{font-size:.7rem;color:var(--blue);font-weight:700;background:rgba(74,158,255,.12);padding:4px 10px;border-radius:6px;white-space:nowrap;}
.week-label.final{color:var(--gold);background:rgba(232,184,75,.12);}

.chart-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:4.6rem 1.25rem 1rem;position:relative;overflow:visible;}

.chart-area{display:flex;flex-direction:column;gap:0;}
.plot-row{display:flex;gap:.5rem;height:300px;}
.y-axis{display:flex;flex-direction:column;justify-content:space-between;font-size:.62rem;color:var(--muted);text-align:right;width:36px;flex-shrink:0;}
.bars-area{flex:1;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-left:1px solid var(--border2);border-bottom:1px solid var(--border2);padding-left:.5rem;position:relative;overflow:visible;}
.grid-line{position:absolute;left:0;right:0;border-top:1px dashed var(--border);}
.labels-row{display:flex;gap:.5rem;margin-top:10px;}
.labels-spacer{width:36px;flex-shrink:0;}
.labels-cols{flex:1;display:flex;justify-content:space-between;gap:10px;padding-left:.5rem;}

.bar-col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;width:0;position:relative;overflow:visible;}
.bar-value-label{font-size:.68rem;font-weight:800;color:var(--gold);text-align:center;line-height:1.2;position:absolute;bottom:100%;left:0;right:0;margin-bottom:10px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar-el{width:100%;max-width:46px;border-radius:5px 5px 0 0;transition:height .25s;position:relative;min-height:2px;display:flex;align-items:flex-end;justify-content:center;}
.bar-bottom-label{font-size:.62rem;font-weight:800;color:rgba(8,12,20,.8);margin-bottom:5px;letter-spacing:.01em;}
.label-col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;min-width:0;}
.bar-team-avatar{width:28px;height:28px;border-radius:50%;background:var(--panel3);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.6rem;flex-shrink:0;}
.bar-team-name{font-size:.6rem;color:var(--muted);text-align:center;margin-top:4px;line-height:1.15;max-width:70px;}

.crown{font-size:1.3rem;line-height:1;filter:drop-shadow(0 0 6px rgba(232,184,75,.6));animation:crownFloat 2.2s ease-in-out infinite;z-index:5;}
@keyframes crownFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.bar-col.is-champion .bar-value-label{color:var(--gold2);}
.bar-col.is-champion .bar-team-avatar{border-width:2px;box-shadow:0 0 0 3px rgba(232,184,75,.15);}

.legend-note{font-size:.68rem;color:var(--muted);margin-top:1.25rem;padding-top:.75rem;border-top:1px solid var(--border);}

.brief-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.4rem;margin-top:1rem;}
.brief-header{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.85rem;flex-wrap:wrap;}
.brief-label{font-size:.68rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;}
.brief-week-tag{font-size:.65rem;color:var(--muted);background:var(--panel2);border:1px solid var(--border2);border-radius:6px;padding:3px 9px;}
.brief-body{font-size:.86rem;line-height:1.65;color:var(--text);white-space:pre-wrap;}
.brief-body.empty{color:var(--muted);font-style:italic;}

.games-panel{display:none;}
.games-panel.active{display:block;}
.games-list{display:flex;flex-direction:column;gap:8px;}

.game-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .15s;}
.game-card.expanded{border-color:var(--border2);}
.game-row{display:flex;align-items:center;gap:.75rem;padding:.7rem .9rem;cursor:pointer;user-select:none;}
.game-row:hover{background:var(--panel2);}
.game-matchup{flex:1;display:flex;align-items:center;justify-content:center;gap:.6rem;min-width:0;}
.game-team{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;}
.game-team.winner{color:var(--gold2);}
.game-score{font-size:.95rem;font-weight:800;min-width:1.4em;text-align:center;}
.game-at{color:var(--muted);font-size:.68rem;font-weight:600;}
.game-status{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:78px;text-align:right;flex-shrink:0;line-height:1.3;}
.game-status.final{color:var(--green);}
.game-expand-icon{color:var(--muted);font-size:.7rem;flex-shrink:0;transition:transform .15s;width:14px;text-align:center;}
.game-card.expanded .game-expand-icon{transform:rotate(180deg);}

.picks-breakdown{border-top:1px solid var(--border);padding:.75rem .9rem .9rem;background:var(--panel2);}
.picks-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.pick-chip{display:flex;align-items:center;gap:6px;background:var(--panel3);border:1px solid var(--border);border-radius:8px;padding:6px 8px;}
.pick-chip.correct{border-color:rgba(62,207,116,.4);}
.pick-chip.incorrect{border-color:rgba(224,82,82,.3);opacity:.75;}
.pick-avatar{width:20px;height:20px;border-radius:50%;background:var(--panel);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.52rem;flex-shrink:0;}
.pick-info{min-width:0;}
.pick-team-name{font-size:.6rem;color:var(--muted);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pick-choice{font-size:.68rem;font-weight:700;line-height:1.2;}
.pick-choice.correct-text{color:var(--green);}
.pick-choice.incorrect-text{color:var(--red);}

@media(max-width:650px){
  .wrap{padding:1rem;}
  .header{padding:.75rem 1rem;}
  .title-main{font-size:1.05rem;}
  .plot-row{height:220px;}
  .bars-area{gap:5px;}
  .bar-team-name{display:none;}
  .picks-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="title-main">PFPI <span>2026</span></div>
      <div class="title-sub">Pro Football Predictions Incorporated &bull; The Greg Cote Show</div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="week-row" id="weekRow"></div>
</div>

<div class="wrap">
  <div class="category-header">
    <div>
      <div class="category-title" id="catTitle"></div>
      <div class="category-desc" id="catDesc"></div>
    </div>
    <div class="week-label" id="weekLabel"></div>
  </div>

  <div class="tie-note hidden" id="tieNote"></div>

  <div class="chart-panel" id="chartPanel">
    <div class="chart-area" id="chartArea">
      <div class="plot-row">
        <div class="y-axis" id="yAxis"></div>
        <div class="bars-area" id="barsArea"></div>
      </div>
      <div class="labels-row">
        <div class="labels-spacer"></div>
        <div class="labels-cols" id="labelsCols"></div>
      </div>
    </div>
    <div class="empty-state hidden" id="chartEmpty"></div>
  </div>

  <div class="games-panel" id="gamesPanel">
    <div class="games-list" id="gamesList"></div>
    <div class="empty-state hidden" id="gamesEmpty"></div>
  </div>

  <div class="brief-panel" id="briefPanel">
    <div class="brief-header">
      <div class="brief-label">Greg's Weekly Brief</div>
      <div class="brief-week-tag" id="briefWeekTag"></div>
    </div>
    <div class="brief-body" id="briefBody"></div>
  </div>

  <div class="legend-note" id="legendNote"></div>
</div>

<script>
const TEAMS = ["Lobos","Roughriders","Maniacs","Critters","Chickens","Ferraris","Llamas","Giraffes"];

const TEAM_COLORS = {
  "Lobos":"#e8b84b","Roughriders":"#4a9eff","Maniacs":"#3ecf74","Critters":"#e05252",
  "Chickens":"#a78bfa","Ferraris":"#f5d07a","Llamas":"#38bdf8","Giraffes":"#fb923c"
};
const TEAM_SHORT = {
  "Lobos":"Greg's Lobos","Roughriders":"Dick's Roughriders","Maniacs":"Mom's Maniacs","Critters":"Chris' Critters",
  "Chickens":"Mike's Chickens","Ferraris":"Christie's Ferraris","Llamas":"Tati's Llamas","Giraffes":"Gracelin's Giraffes"
};
function initials(fullName){
  const words = fullName.replace(/['']s\b/,"'s").split(/\s+/).filter(Boolean);
  if (words.length < 2) return fullName.slice(0,2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
function fmtPct(v){
  const s = v.toFixed(3);
  return s === "1.000" ? "1.000" : s.replace(/^0/, "");
}

const NUM_WEEKS = 18;

// Preseason Week 3 (Aug 27-29, 2026) is a real, live-updating data source
// (Highlightly — see worker.js/BUILD_LOG.md) but not a numbered PFPI week:
// no picks are scored against it, it's a stress-test surface for Yeti. Its
// own button sits to the left of Wk 1 in the week row, chronologically
// before the season, per Yeti (2026-08-25).
const PRESEASON_WEEK_KEY = "preseason-3";

// The 2026 season is now the live site (2025-simulation.html in /archive is
// the retired design/testing tool this replaced — see BUILD_LOG.md). Whatever
// week is currently in progress (or the most recently completed one) is
// CURRENT_WEEK; weeks beyond it haven't happened yet and shouldn't be
// selectable. Starts at 1 (matches the same pre-season fallback
// computeCurrentWeekFromDate() in shared.js uses) and gets corrected to the
// real value once data/current.json loads below — genuinely correct either
// way, never a guess.
let CURRENT_WEEK = 1;

// ── REAL DATA WIRING ──
// The scores worker (worker.js, cron job) publishes data/current.json,
// data/standings.json and data/week-N.json into this repo by polling Big
// Balls Sports Data. Before the 2026 season actually has games with results
// (kickoff Sept 9 2026), most of this legitimately has nothing to show yet —
// render() below reflects that honestly (empty states, not fabricated
// numbers) rather than falling back to placeholder data.
const REAL = { currentWeek: null, standings: null, standingsPct: null, weeks: {}, briefs: {}, tieNotes: {} };

async function fetchJSON(path) {
  try {
    const res = await fetch(path + "?t=" + Date.now()); // cache-bust: GitHub Pages
                                                          // propagation lag is
                                                          // untested, see architecture doc
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function initRealData() {
  const cur = await fetchJSON("data/current.json");
  if (cur && cur.currentWeek) {
    REAL.currentWeek = cur.currentWeek;
    CURRENT_WEEK = cur.currentWeek;
    currentWeek = cur.currentWeek; // one-time sync on initial load only —
                                    // later polls don't override the week
                                    // the visitor has manually selected
    const st = await fetchJSON("data/standings.json");
    if (st && st.standings) {
      REAL.standings = st.standings;
      REAL.standingsPct = st.standingsPct;
      REAL.tieNotes = st.tieNotes || {};
    }
  }
  await render();
}

async function loadRealWeek(week) {
  if (REAL.weeks[week] !== undefined) return REAL.weeks[week];
  // Preseason isn't a numbered PFPI week, so it skips the currentWeek gate
  // below entirely — it's real data with real games, just not part of the
  // regular season's progressive reveal.
  if (week === PRESEASON_WEEK_KEY) {
    const data = await fetchJSON(`data/week-${week}.json`);
    REAL.weeks[week] = (data && Array.isArray(data.games)) ? data.games : null;
    return REAL.weeks[week];
  }
  if (!REAL.currentWeek || week > REAL.currentWeek) { REAL.weeks[week] = null; return null; }
  const data = await fetchJSON(`data/week-${week}.json`);
  REAL.weeks[week] = (data && Array.isArray(data.games)) ? data.games : null;
  return REAL.weeks[week];
}

async function loadRealBrief(week) {
  if (REAL.briefs[week] !== undefined) return REAL.briefs[week];
  const data = await fetchJSON(`data/brief-week-${week}.json`);
  REAL.briefs[week] = (data && typeof data.text === "string") ? data.text : null;
  return REAL.briefs[week];
}

function hasRealStandingsForWeek(week) {
  return !!REAL.standings && TEAMS.every(t => REAL.standings[t] && REAL.standings[t][String(week)] !== undefined);
}

// Category defs unchanged from the original build (scope of the 2025->2026
// switchover is a data-source swap, not a rules change) — only getData
// changed, from "real-or-simulated" to "real-or-null". weeksLeading,
// weeklyTitles, tenWin, uniqueHits, and bestWeek have no real-data source at
// all yet (no Worker computes them — the tie-splitting rule they'd need was
// never defined, see BUILD_LOG.md's original SCOPE NOTE), so they render an
// honest empty state unconditionally until that's resolved in a future
// build, not silently forever.
const CATEGORIES = {
  standings: {
    label: "Standings",
    title: "Season standings",
    desc: "Cumulative correct picks through the selected week.",
    getData: w => hasRealStandingsForWeek(w) ? REAL.standings : null, unit: "", key: w => w, isStandings: true
  },
  weeksLeading: {
    label: "Weeks Leading",
    title: "Weeks leading",
    desc: "Points for holding first place in the overall standings, split on ties.",
    getData: w => null, unit: "pts", key: w => w
  },
  weeklyTitles: {
    label: "Weekly Titles",
    title: "Weekly titles",
    desc: "Points for the best record in each individual week, split on ties.",
    getData: w => null, unit: "pts", key: w => w
  },
  tenWin: {
    label: "10-Win Weeks",
    title: "10-win weeks",
    desc: "Count of weeks with 10+ correct picks, through the selected week.",
    getData: w => null, unit: "wks", key: w => w
  },
  uniqueHits: {
    label: "Unique Hits",
    title: "Unique hits",
    desc: "Hits-to-opportunities on picks nobody else made, through the selected week.",
    getData: w => null, unit: "", key: w => w, isHitsOpps: true
  },
  bestWeek: {
    label: "Best Week",
    title: "Best week (running record)",
    desc: "Each team's best single-week record so far this season — only increases when beaten.",
    getData: w => null, unit: "", key: w => w, isBestWeek: true
  }
};

let currentCat = "standings";
let currentWeek = CURRENT_WEEK;

function renderTabs(){
  const el = document.getElementById("tabs"); el.innerHTML = "";

  const gamesBtn = document.createElement("button");
  gamesBtn.className = "tab-btn" + (currentCat === "games" ? " active" : "");
  gamesBtn.textContent = "Games";
  gamesBtn.onclick = () => { currentCat = "games"; render(); };
  el.appendChild(gamesBtn);

  Object.keys(CATEGORIES).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (key===currentCat ? " active":"");
    btn.textContent = CATEGORIES[key].label;
    btn.onclick = () => { currentCat = key; render(); };
    el.appendChild(btn);
  });
}

function renderWeekRow(){
  const el = document.getElementById("weekRow"); el.innerHTML = "";

  const preseasonBtn = document.createElement("button");
  preseasonBtn.className = "week-btn" + (currentWeek === PRESEASON_WEEK_KEY ? " active" : "");
  preseasonBtn.textContent = "Preseason";
  // Games is the only category that makes sense for preseason -- no PFPI
  // picks are scored against it, so Standings/etc. would just show an
  // honest "no data" empty state. Switching straight to Games is the more
  // useful default than making a visitor click over themselves.
  preseasonBtn.onclick = () => { currentWeek = PRESEASON_WEEK_KEY; currentCat = "games"; render(); };
  el.appendChild(preseasonBtn);

  for (let w=1; w<=CURRENT_WEEK; w++){
    const btn = document.createElement("button");
    const isCurrent = w === CURRENT_WEEK;
    const isSeasonFinal = w === NUM_WEEKS;
    btn.className = "week-btn" + (w===currentWeek?" active":"") + (isCurrent?" final":"");
    btn.textContent = isSeasonFinal ? "Final" : "Wk " + w;
    btn.onclick = () => { currentWeek = w; render(); };
    el.appendChild(btn);
  }
}

async function render(){
  renderTabs(); renderWeekRow();

  const isPreseason = currentWeek === PRESEASON_WEEK_KEY;
  const isFinal = !isPreseason && currentWeek === NUM_WEEKS;
  const weekLabelEl = document.getElementById("weekLabel");
  weekLabelEl.textContent = isPreseason ? "Preseason Week 3" : isFinal ? "Final — Week 18" : "Through Week " + currentWeek;
  weekLabelEl.className = "week-label" + (isFinal?" final":"");

  // Tie-game note, per Yeti (2026-08-25): visible near the chart, not
  // buried in a tooltip, for any week with a real nullified tie. Same
  // "runs before the games/chart split, shown regardless of category"
  // placement as the brief below, since a tie affects every category's
  // numbers for that week, not just one tab. Stays hidden (not a fabricated
  // example) until a real tie actually happens in real data.
  const tieNoteEl = document.getElementById("tieNote");
  const weekTies = REAL.tieNotes[currentWeek];
  if (weekTies && weekTies.length > 0) {
    const plural = weekTies.length > 1 ? "s" : "";
    tieNoteEl.textContent = `Week ${currentWeek}: ${weekTies.join(", ")} ended in a tie${plural} and ${weekTies.length > 1 ? "were" : "was"} nullified for scoring purposes.`;
    tieNoteEl.classList.remove("hidden");
  } else {
    tieNoteEl.classList.add("hidden");
  }

  // Brief shows under the chart regardless of which category tab is active —
  // it's tied to the selected week, not the selected category — so this
  // runs before the games/chart branch split below, not inside either one.
  // Doesn't apply to preseason at all (Greg's brief is a real-season thing),
  // so it's hidden outright rather than showing a not-applicable empty state.
  const briefPanelEl = document.getElementById("briefPanel");
  if (isPreseason) {
    briefPanelEl.classList.add("hidden");
  } else {
    briefPanelEl.classList.remove("hidden");
    const briefBodyEl = document.getElementById("briefBody");
    const briefWeekTagEl = document.getElementById("briefWeekTag");
    briefWeekTagEl.textContent = isFinal ? "Week " + NUM_WEEKS + " — Final" : "Week " + currentWeek;
    const brief = await loadRealBrief(currentWeek);
    if (brief) {
      briefBodyEl.textContent = brief;
      briefBodyEl.className = "brief-body";
    } else {
      briefBodyEl.textContent = "Greg hasn't published a brief for this week yet.";
      briefBodyEl.className = "brief-body empty";
    }
  }

  const chartPanel = document.getElementById("chartPanel");
  const gamesPanel = document.getElementById("gamesPanel");

  if (currentCat === "games") {
    chartPanel.style.display = "none";
    gamesPanel.className = "games-panel active";
    document.getElementById("catTitle").textContent = isPreseason ? "Preseason Week 3 games" : "Week " + currentWeek + " games";
    document.getElementById("catDesc").textContent = "Tap a game to see everyone's pick.";

    const realGames = await loadRealWeek(currentWeek);
    const gamesListEl = document.getElementById("gamesList");
    const gamesEmptyEl = document.getElementById("gamesEmpty");
    if (realGames && realGames.length > 0) {
      gamesListEl.classList.remove("hidden");
      gamesEmptyEl.classList.add("hidden");
      document.getElementById("legendNote").textContent = isPreseason
        ? "Live preseason NFL scores. No PFPI picks are made for preseason games."
        : "Live NFL scores and real picks for this week.";
      renderGames(realGames);
    } else {
      gamesListEl.classList.add("hidden");
      gamesListEl.innerHTML = "";
      gamesEmptyEl.classList.remove("hidden");
      gamesEmptyEl.textContent = "No games published for this week yet.";
      document.getElementById("legendNote").textContent = "";
    }
    return;
  }

  chartPanel.style.display = "";
  gamesPanel.className = "games-panel";

  const cat = CATEGORIES[currentCat];
  document.getElementById("catTitle").textContent = cat.title;
  document.getElementById("catDesc").textContent = cat.desc;

  const dataset = cat.getData(currentWeek);
  const wKey = String(currentWeek);

  const chartAreaEl = document.getElementById("chartArea");
  const chartEmptyEl = document.getElementById("chartEmpty");
  if (!dataset) {
    chartAreaEl.classList.add("hidden");
    chartEmptyEl.classList.remove("hidden");
    chartEmptyEl.textContent = "No " + cat.label.toLowerCase() + " data yet — check back once games are played.";
    document.getElementById("legendNote").textContent = "";
    return;
  }
  chartAreaEl.classList.remove("hidden");
  chartEmptyEl.classList.add("hidden");

  const barsArea = document.getElementById("barsArea");
  const yAxis = document.getElementById("yAxis");
  const labelsCols = document.getElementById("labelsCols");
  barsArea.innerHTML = ""; yAxis.innerHTML = ""; labelsCols.innerHTML = "";

  let values = {};
  let labels = {};
  let bottomLabels = {};

  if (cat.isBestWeek) {
    TEAMS.forEach(t => {
      const d = dataset[t][wKey];
      values[t] = d.pct;
      labels[t] = `${d.correct}-${d.total-d.correct}\n(Wk ${d.week})`;
      bottomLabels[t] = fmtPct(d.pct);
    });
  } else if (cat.isHitsOpps) {
    TEAMS.forEach(t => {
      const d = dataset[t][wKey];
      values[t] = d.hits;
      labels[t] = `${d.hits}-${d.opps}`;
    });
  } else if (cat.isStandings) {
    // Reaching here means dataset came from getData() non-null, which for
    // this category only ever happens when hasRealStandingsForWeek() is
    // true (see CATEGORIES above) — so REAL.standingsPct is guaranteed set.
    const pctSource = REAL.standingsPct;
    TEAMS.forEach(t => {
      const v = dataset[t][wKey];
      values[t] = v;
      labels[t] = String(v);
      bottomLabels[t] = fmtPct(pctSource[t][wKey]);
    });
  } else {
    TEAMS.forEach(t => {
      const v = dataset[t][wKey];
      values[t] = v;
      labels[t] = String(v);
    });
  }

  const maxVal = Math.max(...TEAMS.map(t => values[t]), 0.01);
  const ticks = 4;
  for (let i=ticks; i>=0; i--){
    const d = document.createElement("div");
    const tickVal = cat.isBestWeek ? (maxVal/ticks*i).toFixed(2) : Math.round(maxVal/ticks*i*100)/100;
    d.textContent = tickVal;
    yAxis.appendChild(d);
  }
  for (let i=1; i<ticks; i++){
    const line = document.createElement("div");
    line.className = "grid-line";
    line.style.bottom = (i/ticks*100)+"%";
    barsArea.appendChild(line);
  }

  // For Best Week, find whichever team currently holds the season's best pct.
  // Ties (identical pct) get the crown too, rather than arbitrarily picking one.
  let championTeam = null;
  if (cat.isBestWeek) {
    const topPct = Math.max(...TEAMS.map(t => values[t]));
    const holders = TEAMS.filter(t => values[t] === topPct);
    championTeam = holders; // array, supports shared crown on a tie
  }

  TEAMS.forEach(team => {
    const val = values[team];
    const pct = Math.max(2, Math.round((val/maxVal)*1000)/10);
    const color = TEAM_COLORS[team];
    const isChamp = championTeam && championTeam.includes(team);
    const bottomLabel = bottomLabels[team];

    const col = document.createElement("div");
    col.className = "bar-col" + (isChamp ? " is-champion" : "");
    col.innerHTML = `
      <div class="bar-el" style="height:${pct}%;background:${color}">
        <div class="bar-value-label">
          ${isChamp ? '<div class="crown">&#128081;</div>' : ""}
          <div>${labels[team].replace("\n","<br>")}</div>
        </div>
        ${bottomLabel ? `<div class="bar-bottom-label">${bottomLabel}</div>` : ""}
      </div>
    `;
    barsArea.appendChild(col);

    const labelCol = document.createElement("div");
    labelCol.className = "label-col";
    labelCol.innerHTML = `
      <div class="bar-team-avatar" style="border-color:${color};color:${color}">${initials(TEAM_SHORT[team])}</div>
      <div class="bar-team-name">${TEAM_SHORT[team]}</div>
    `;
    labelsCols.appendChild(labelCol);
  });

  // Every category reaching this point already passed the !dataset early
  // return above, so this is always real data, never a placeholder.
  document.getElementById("legendNote").textContent =
    "Live data. Team order is fixed and never re-sorted by score.";
}

let expandedGameIdx = null;

// Highlightly (preseason) gives a real kickoff timestamp; Big Balls
// (regular season) only gives a real calendar date, anchored to a
// placeholder noon-UTC time for deadline math (see worker.js's gap
// notice) — hasRealTime tells these apart so a fabricated time is never
// shown for regular-season games, only a real one for preseason.
function formatKickoff(g) {
  if (!g.kickoffISO) return null;
  const d = new Date(g.kickoffISO);
  const opts = g.hasRealTime
    ? { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }
    : { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric" };
  return new Intl.DateTimeFormat("en-US", opts).format(d) + (g.hasRealTime ? " ET" : "");
}

// Only ever called with real, non-empty game data (render() shows the empty
// state itself otherwise) — see BUILD_LOG.md for the 2025-sim archival that
// removed the simulated-schedule fallback this used to have.
function renderGames(realGames){
  const gamesList = document.getElementById("gamesList");
  gamesList.innerHTML = "";

  // Real data (worker.js) carries confirmed home/away from Big Balls' game_id
  // format, so this is accurate, not a known limitation. See BUILD_LOG.md.
  // Sorted chronologically by kickoff -- neither Big Balls nor Highlightly
  // guarantee return order, per Yeti (2026-08-25, caught Aug 29's slate
  // showing before Aug 27's on the Preseason view).
  const sortedGames = [...realGames].sort((a, b) => new Date(a.kickoffISO) - new Date(b.kickoffISO));
  sortedGames.forEach((g, idx) => {
    const isExpanded = expandedGameIdx === idx;
    const card = document.createElement("div");
    card.className = "game-card" + (isExpanded ? " expanded" : "");

    const isFinal = g.status === "final";
    const homeWon = isFinal && g.winner === g.home;
    const awayWon = isFinal && g.winner === g.away;
    const statusLabel = g.status === "final" ? "Final"
      : g.status === "in_progress" ? "Live"
      : (formatKickoff(g) || "Upcoming");
    const homeDisplay = g.homeScore ?? (isFinal ? "" : "-");
    const awayDisplay = g.awayScore ?? (isFinal ? "" : "-");

    const row = document.createElement("div");
    row.className = "game-row";
    row.innerHTML = `
      <div class="game-matchup">
        <div class="game-team${homeWon ? " winner" : ""}">${g.home}</div>
        <div class="game-score">${homeDisplay}</div>
        <div class="game-at"></div>
        <div class="game-score">${awayDisplay}</div>
        <div class="game-team${awayWon ? " winner" : ""}">${g.away}</div>
      </div>
      <div class="game-status${isFinal ? " final" : ""}">${statusLabel}</div>
      <div class="game-expand-icon">&#9660;</div>
    `;
    row.onclick = () => {
      expandedGameIdx = isExpanded ? null : idx;
      renderGames(realGames);
    };
    card.appendChild(row);

    if (isExpanded) {
      const breakdown = document.createElement("div");
      breakdown.className = "picks-breakdown";
      const grid = document.createElement("div");
      grid.className = "picks-grid";
      TEAMS.forEach(team => {
        // Preseason games (Highlightly) have no picks object at all -- no
        // PFPI picks are ever made against them -- unlike regular-season
        // games, which always carry one (possibly empty) via
        // buildWeekPublicJSON(). Guard rather than assume it exists.
        const pick = (g.picks && g.picks[team]) || null;
        const correct = (pick && isFinal) ? pick === g.winner : null;
        const color = TEAM_COLORS[team];
        const chip = document.createElement("div");
        chip.className = "pick-chip " + (correct === null ? "" : correct ? "correct" : "incorrect");
        chip.innerHTML = `
          <div class="pick-avatar" style="border-color:${color};color:${color}">${initials(TEAM_SHORT[team])}</div>
          <div class="pick-info">
            <div class="pick-team-name">${TEAM_SHORT[team]}</div>
            <div class="pick-choice ${correct === null ? "" : correct ? "correct-text" : "incorrect-text"}">${pick || "No pick yet"}</div>
          </div>
        `;
        grid.appendChild(chip);
      });
      breakdown.appendChild(grid);
      card.appendChild(breakdown);
    }

    gamesList.appendChild(card);
  });
}

render();       // instant paint with honest empty states, no flash of blank content
initRealData(); // then swap in real data where it exists (mostly a no-op
                 // until the 2026 season actually has games/results)
</script>
</body>
</html>
